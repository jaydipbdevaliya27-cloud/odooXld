<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Court Booking Desk – Champions Club</title>
  <meta name="description" content="Champions Club booking desk: manage today's court schedule, create new bookings, check-in members">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="cc-wrapper">

  <!-- ── Sidebar (Booking Desk Staff) ─────────────────────────────────────── -->
  <nav class="cc-sidebar d-flex flex-column">
    <div class="brand"><i class="bi bi-trophy-fill me-2 text-warning"></i>Champions Club</div>
    <ul class="nav flex-column mt-2 flex-grow-1">
      <li><a href="/staff/dashboard.html"  class="nav-link active"><i class="bi bi-calendar-check"></i>Court Booking Desk</a></li>
      <li><a href="/owner/bookings.html"   class="nav-link"><i class="bi bi-calendar-plus"></i>All Bookings</a></li>
      <li><a href="/owner/members.html"    class="nav-link"><i class="bi bi-people"></i>Members</a></li>
      <li><a href="/owner/leads.html"      class="nav-link"><i class="bi bi-person-plus"></i>Leads</a></li>
      <li><a href="/owner/courts.html"     class="nav-link"><i class="bi bi-geo-alt"></i>Courts</a></li>
    </ul>
    <div class="p-3">
      <span id="userNameSidebar" class="small text-muted d-block mb-2"></span>
      <button id="logoutBtn" class="btn btn-sm btn-outline-light w-100">
        <i class="bi bi-box-arrow-right me-1"></i>Logout
      </button>
    </div>
  </nav>

  <div class="d-flex flex-column flex-grow-1">
    <div class="cc-topbar">
      <h5 class="page-title"><i class="bi bi-calendar-check me-2 text-cc"></i>Court Booking Desk</h5>
      <div class="d-flex align-items-center gap-2">
        <span id="todayDate" class="text-muted small"></span>
        <button class="btn btn-cc btn-sm" data-bs-toggle="modal" data-bs-target="#newBookingModal">
          <i class="bi bi-plus-circle-fill me-1"></i>New Booking
        </button>
      </div>
    </div>

    <main class="cc-main">

      <!-- KPI Row -->
      <div class="row g-3 mb-4">
        <div class="col-sm-6 col-xl-3">
          <div class="kpi-card">
            <div class="kpi-icon bg-primary bg-opacity-10 text-primary"><i class="bi bi-calendar-check"></i></div>
            <div><div class="kpi-value" id="kpiToday">—</div><div class="kpi-label">Today's Bookings</div></div>
          </div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="kpi-card">
            <div class="kpi-icon bg-success bg-opacity-10 text-success"><i class="bi bi-check-circle"></i></div>
            <div><div class="kpi-value" id="kpiConfirmed">—</div><div class="kpi-label">Confirmed</div></div>
          </div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="kpi-card">
            <div class="kpi-icon bg-info bg-opacity-10 text-info"><i class="bi bi-people"></i></div>
            <div><div class="kpi-value" id="kpiMembers">—</div><div class="kpi-label">Active Members</div></div>
          </div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="kpi-card">
            <div class="kpi-icon bg-cc bg-opacity-10" style="color:var(--cc-green)"><i class="bi bi-geo-alt"></i></div>
            <div><div class="kpi-value" id="kpiCourts">—</div><div class="kpi-label">Available Courts</div></div>
          </div>
        </div>
      </div>

      <!-- Date filter + Today's Schedule -->
      <div class="cc-card mb-3">
        <div class="cc-card-header">
          <h5><i class="bi bi-calendar3 me-2 text-cc"></i>Court Schedule</h5>
          <div class="d-flex gap-2 align-items-center">
            <input type="date" id="scheduleDate" class="form-control form-control-sm" style="width:160px">
            <button class="btn btn-sm btn-outline-secondary" onclick="loadSchedule()">
              <i class="bi bi-arrow-clockwise me-1"></i>Refresh
            </button>
          </div>
        </div>
        <div class="table-responsive mt-2">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Booking Code</th><th>Court</th><th>Time</th>
                <th>Member / Guest</th><th>Amount</th><th>Status</th><th class="text-end">Action</th>
              </tr>
            </thead>
            <tbody id="scheduleBody">
              <tr><td colspan="7" class="text-center py-4 text-muted">
                <span class="spinner-border spinner-border-sm me-2"></span>Loading schedule…
              </td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- ── New Booking Modal ─────────────────────────────────────────────────── -->
<div class="modal fade" id="newBookingModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-light">
        <h5 class="modal-title"><i class="bi bi-calendar-plus me-2 text-cc"></i>New Court Booking</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="bookForm">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Court *</label>
              <select id="bkCourt" class="form-select" required>
                <option value="">-- Select court --</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Date *</label>
              <input type="date" id="bkDate" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Start Time *</label>
              <select id="bkStart" class="form-select" required></select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Duration *</label>
              <select id="bkDuration" class="form-select">
                <option value="1">1 Hour</option>
                <option value="2">2 Hours</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Member (optional)</label>
              <select id="bkMember" class="form-select">
                <option value="">-- Walk-in Guest --</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Payment Method</label>
              <select id="bkPayment" class="form-select">
                <option value="cash">Cash</option>
                <option value="card">Card</option>
                <option value="upi">UPI</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Guest Name (if walk-in)</label>
              <input type="text" id="bkGuest" class="form-control" placeholder="Walk-in guest name">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Guest Phone</label>
              <input type="tel" id="bkGuestPhone" class="form-control" placeholder="9900000000">
            </div>
          </div>
          <div id="bkErr" class="alert alert-danger mt-3 d-none small py-2"></div>
        </form>
      </div>
      <div class="modal-footer bg-light">
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-cc fw-semibold" onclick="confirmBooking()">
          <i class="bi bi-check-circle me-1"></i>Confirm Booking
        </button>
      </div>
    </div>
  </div>
</div>

<div id="alert-bar"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script>
const TODAY = new Date().toISOString().slice(0, 10);

document.addEventListener('DOMContentLoaded', async () => {
  const user = await loadSession();
  if (!user || (user.role !== 'staff' && user.role !== 'owner')) {
    window.location.href = '/shared/login.html'; return;
  }
  document.getElementById('userNameSidebar').textContent = user.full_name;
  document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-IN', {
    weekday: 'long', year: 'numeric', month: 'short', day: 'numeric'
  });

  // Set default schedule date to today
  document.getElementById('scheduleDate').value = TODAY;

  // Populate start-time options (06:00 – 21:00)
  const startSel = document.getElementById('bkStart');
  for (let h = 6; h <= 21; h++) {
    ['00', '30'].forEach(m => {
      const val  = `${String(h).padStart(2,'0')}:${m}:00`;
      const disp = `${String(h).padStart(2,'0')}:${m}`;
      startSel.insertAdjacentHTML('beforeend', `<option value="${val}">${disp}</option>`);
    });
  }
  document.getElementById('bkDate').value = TODAY;
  document.getElementById('bkDate').min   = TODAY;

  // Load courts into booking modal
  try {
    const courts = await api.get('/api/courts');
    document.getElementById('kpiCourts').textContent = courts.length;
    courts.forEach(c => {
      document.getElementById('bkCourt').insertAdjacentHTML('beforeend',
        `<option value="${c.id}" data-price="${c.base_price_per_hour}">${escHtml(c.name)} — ₹${c.base_price_per_hour}/hr</option>`);
    });
  } catch { }

  // Load members into booking modal
  try {
    const res = await api.get('/api/members');
    const members = res.members || res;
    (Array.isArray(members) ? members : []).forEach(m => {
      document.getElementById('bkMember').insertAdjacentHTML('beforeend',
        `<option value="${m.id}">${escHtml(m.full_name)} (${escHtml(m.member_code)})</option>`);
    });
    document.getElementById('kpiMembers').textContent =
      (Array.isArray(members) ? members : []).filter(m => m.status === 'active').length;
  } catch { }

  await loadSchedule();

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await api.post('/api/auth/logout');
    window.location.href = '/shared/login.html';
  });
});

async function loadSchedule() {
  const date  = document.getElementById('scheduleDate').value || TODAY;
  const tbody = document.getElementById('scheduleBody');
  tbody.innerHTML = `<tr><td colspan="7" class="text-center py-3">
    <span class="spinner-border spinner-border-sm me-2"></span>Loading…</td></tr>`;
  try {
    const bookings = await api.get('/api/bookings?date=' + date);
    document.getElementById('kpiToday').textContent     = bookings.length;
    document.getElementById('kpiConfirmed').textContent = bookings.filter(b => b.status === 'confirmed').length;

    if (!bookings.length) {
      tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">
        <i class="bi bi-calendar-x fs-4 d-block mb-1"></i>No bookings for ${date}</td></tr>`;
      return;
    }
    tbody.innerHTML = bookings.map(b => `
      <tr>
        <td><code>${escHtml(b.booking_code)}</code></td>
        <td><strong>${escHtml(b.court_name)}</strong><br><small class="text-muted">${escHtml(b.sport)}</small></td>
        <td>${String(b.start_time).slice(0,5)} – ${String(b.end_time).slice(0,5)}</td>
        <td>${escHtml(b.member_name || b.guest_name || 'Walk-in Guest')}</td>
        <td>${fmtINR(b.price_charged)}</td>
        <td>${statusBadge(b.status)}</td>
        <td class="text-end">
          ${b.status === 'confirmed' ? `
            <button class="btn btn-sm btn-outline-danger" onclick="cancelBooking(${b.id})">
              <i class="bi bi-x-circle"></i> Cancel
            </button>` : ''}
        </td>
      </tr>`).join('');
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="7" class="text-danger text-center py-3">${escHtml(err.message)}</td></tr>`;
  }
}

async function confirmBooking() {
  const courtId    = document.getElementById('bkCourt').value;
  const date       = document.getElementById('bkDate').value;
  const startTime  = document.getElementById('bkStart').value;
  const duration   = parseInt(document.getElementById('bkDuration').value, 10);
  const memberId   = document.getElementById('bkMember').value || null;
  const payMethod  = document.getElementById('bkPayment').value;
  const guestName  = document.getElementById('bkGuest').value.trim();
  const guestPhone = document.getElementById('bkGuestPhone').value.trim();
  const errBox     = document.getElementById('bkErr');

  if (!courtId || !date || !startTime) {
    errBox.textContent = 'Please fill in Court, Date and Start Time.';
    errBox.classList.remove('d-none');
    return;
  }

  // Compute end time
  const [h, m] = startTime.split(':').map(Number);
  const endDate = new Date(2000, 0, 1, h + duration, m);
  const endTime = `${String(endDate.getHours()).padStart(2,'0')}:${String(endDate.getMinutes()).padStart(2,'0')}:00`;

  errBox.classList.add('d-none');
  try {
    const res = await api.post('/api/bookings', {
      court_id: courtId,
      booking_date: date,
      start_time: startTime,
      end_time: endTime,
      member_id: memberId || undefined,
      guest_name: guestName || undefined,
      guest_phone: guestPhone || undefined,
      payment_method: payMethod
    });
    showAlert(`Booking confirmed! Code: ${res.booking_code}`, 'success');
    bootstrap.Modal.getInstance(document.getElementById('newBookingModal')).hide();
    document.getElementById('scheduleDate').value = date;
    await loadSchedule();
  } catch (err) {
    errBox.textContent = err.message || 'Booking failed.';
    errBox.classList.remove('d-none');
  }
}

async function cancelBooking(id) {
  if (!confirm('Cancel this booking?')) return;
  try {
    await api.post(`/api/bookings/${id}/cancel`, { reason: 'Cancelled by front desk' });
    showAlert('Booking cancelled.', 'warning');
    await loadSchedule();
  } catch (err) {
    showAlert(err.message || 'Cancel failed.', 'danger');
  }
}
</script>
</body>
</html>
