<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard – Champions Club</title>
  <meta name="description" content="Champions Club member dashboard: membership card, benefits, and recent bookings">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="cc-wrapper">

  <!-- ── Sidebar ────────────────────────────────────────────────────────────── -->
  <nav class="cc-sidebar d-flex flex-column">
    <div class="brand"><i class="bi bi-trophy-fill me-2 text-warning"></i>Champions Club</div>
    <ul class="nav flex-column mt-2 flex-grow-1">
      <li><a href="/member/dashboard.html" class="nav-link active"><i class="bi bi-house"></i>My Dashboard</a></li>
      <li><a href="/member/book.html"      class="nav-link"><i class="bi bi-calendar-plus"></i>Book a Court</a></li>
      <li><a href="/member/bookings.html"  class="nav-link"><i class="bi bi-calendar-check"></i>My Bookings</a></li>
    </ul>
    <div class="p-3">
      <span id="userNameSidebar" class="small text-muted d-block mb-2"></span>
      <button id="logoutBtn" class="btn btn-sm btn-outline-light w-100">
        <i class="bi bi-box-arrow-right me-1"></i>Logout
      </button>
    </div>
  </nav>

  <div class="d-flex flex-column flex-grow-1">
    <div class="cc-topbar">
      <h5 class="page-title" id="welcomeTitle">Welcome!</h5>
      <span id="todayDate" class="text-muted small"></span>
    </div>

    <main class="cc-main">

      <!-- Membership Card + Benefits -->
      <div class="row g-3 mb-4">

        <!-- Membership Card -->
        <div class="col-lg-5">
          <div class="cc-card h-100" id="memberCard"
               style="background:linear-gradient(135deg,var(--cc-green) 0%,var(--cc-green-dark,#1b5e20) 100%);color:#fff">
            <div class="d-flex justify-content-between align-items-start mb-3">
              <div>
                <p class="mb-0 small opacity-75">Member Code</p>
                <h5 id="memberCode" class="mb-0 fw-bold">—</h5>
              </div>
              <i class="bi bi-trophy-fill text-warning fs-2"></i>
            </div>
            <h4 id="memberName" class="mb-1">—</h4>
            <p id="planName"   class="mb-3 opacity-75 fw-semibold">—</p>
            <div class="d-flex gap-4 flex-wrap">
              <div>
                <p class="mb-0 small opacity-75">Joined</p>
                <p id="joinDate" class="mb-0 fw-semibold">—</p>
              </div>
              <div>
                <p class="mb-0 small opacity-75">Expires</p>
                <p id="expiryDate" class="mb-0 fw-semibold">—</p>
              </div>
              <div>
                <p class="mb-0 small opacity-75">Status</p>
                <p id="memberStatus" class="mb-0 fw-semibold">—</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Benefits -->
        <div class="col-lg-7">
          <div class="cc-card h-100">
            <h6 class="fw-bold mb-3"><i class="bi bi-percent me-2 text-cc"></i>My Membership Benefits</h6>
            <div class="row g-3" id="benefitsRow">
              <div class="col-12 text-center text-muted py-3">
                <span class="spinner-border spinner-border-sm me-2"></span>Loading…
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Quick Book -->
      <div class="cc-card mb-3">
        <div class="cc-card-header">
          <h5><i class="bi bi-calendar-plus me-2 text-cc"></i>Quick Actions</h5>
        </div>
        <div class="d-flex gap-2 flex-wrap mt-2">
          <a href="/member/book.html" class="btn btn-cc">
            <i class="bi bi-calendar-plus-fill me-1"></i>Book a Court
          </a>
          <a href="/member/bookings.html" class="btn btn-outline-secondary">
            <i class="bi bi-list-check me-1"></i>View My Bookings
          </a>
        </div>
      </div>

      <!-- Recent Bookings -->
      <div class="cc-card">
        <div class="cc-card-header">
          <h5><i class="bi bi-clock-history me-2 text-cc"></i>Recent Bookings</h5>
          <a href="/member/bookings.html" class="btn btn-sm btn-outline-secondary">View All</a>
        </div>
        <div class="table-responsive mt-2">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr><th>Court</th><th>Date</th><th>Time</th><th>Amount</th><th>Status</th></tr>
            </thead>
            <tbody id="recentBody">
              <tr><td colspan="5" class="text-center text-muted py-3">
                <span class="spinner-border spinner-border-sm me-2"></span>Loading…
              </td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>

<div id="alert-bar"></div>
<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script>
(async () => {
  // ── Session check ──────────────────────────────────────────────────────────
  const user = await loadSession();
  if (!user) return;

  document.getElementById('userNameSidebar').textContent = user.full_name;
  document.getElementById('welcomeTitle').textContent    = `Welcome back, ${user.full_name.split(' ')[0]}!`;
  document.getElementById('todayDate').textContent       = new Date().toLocaleDateString('en-IN', {
    weekday: 'long', year: 'numeric', month: 'short', day: 'numeric'
  });

  // ── Membership profile ─────────────────────────────────────────────────────
  try {
    const m = await api.get('/api/members/me');  // Uses the new /me endpoint

    document.getElementById('memberCode').textContent   = m.member_code || '—';
    document.getElementById('memberName').textContent   = m.full_name   || user.full_name;
    document.getElementById('planName').textContent     = (m.plan_name  || '—') + ' Plan';
    document.getElementById('joinDate').textContent     = fmtDate(m.join_date);
    document.getElementById('expiryDate').textContent   = fmtDate(m.expiry_date);
    document.getElementById('memberStatus').textContent = (m.status || '—').toUpperCase();

    // Colour card red if expired/suspended
    if (m.status !== 'active') {
      document.getElementById('memberCard').style.background =
        'linear-gradient(135deg,#c62828 0%,#7f0000 100%)';
    }

    // Benefits grid
    document.getElementById('benefitsRow').innerHTML = `
      <div class="col-md-4">
        <div class="text-center p-3 rounded" style="background:#f5f7f5">
          <div class="fs-2 fw-bold text-cc">${m.court_discount_pct}%</div>
          <div class="small text-muted">Court Discount</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="text-center p-3 rounded" style="background:#f5f7f5">
          <div class="fs-2 fw-bold text-cc">${m.shop_discount_pct}%</div>
          <div class="small text-muted">Shop Discount</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="text-center p-3 rounded" style="background:#f5f7f5">
          <div class="fs-2 fw-bold text-cc">${m.bar_discount_pct}%</div>
          <div class="small text-muted">Bar Discount</div>
        </div>
      </div>
      <div class="col-12">
        <div class="p-3 rounded" style="background:#f5f7f5">
          <i class="bi bi-calendar-check text-cc me-2"></i>
          Up to <strong>${m.max_bookings_per_day}</strong> court bookings per day
        </div>
      </div>`;
  } catch (e) {
    document.getElementById('benefitsRow').innerHTML =
      '<div class="col-12 text-muted">Membership data not available. Please contact the club.</div>';
  }

  // ── Recent bookings ────────────────────────────────────────────────────────
  try {
    const bookings = await api.get('/api/bookings');
    const tbody    = document.getElementById('recentBody');
    const recent   = Array.isArray(bookings) ? bookings.slice(0, 5) : [];

    if (!recent.length) {
      tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-3">
        No bookings yet. <a href="/member/book.html">Book your first court!</a>
      </td></tr>`;
    } else {
      tbody.innerHTML = recent.map(b => `
        <tr>
          <td>${escHtml(b.court_name||'—')} <small class="text-muted">(${escHtml(b.sport||'')})</small></td>
          <td>${fmtDate(b.booking_date)}</td>
          <td>${String(b.start_time||'').slice(0,5)} – ${String(b.end_time||'').slice(0,5)}</td>
          <td>${fmtINR(b.price_charged)}</td>
          <td>${statusBadge(b.status)}</td>
        </tr>`).join('');
    }
  } catch { }

  // ── Logout ─────────────────────────────────────────────────────────────────
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await api.post('/api/auth/logout');
    window.location.href = '/shared/login.html';
  });
})();
</script>
</body>
</html>
