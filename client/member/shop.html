<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Shop Catalog - Champions Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 235px), 1fr));
      gap: 1rem;
    }
    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s ease;
    }
    .product-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .product-card-img {
      height: auto;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: var(--surface-alt);
      width: 100%;
    }
    .product-card-body {
      padding: 0.9rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .product-image-fallback {
      aspect-ratio: 4 / 3;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent-soft), var(--surface-alt));
      color: var(--accent);
      font-size: 2rem;
    }
    @media (max-width: 575.98px) {
      .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.65rem; }
      .product-card-body { padding: 0.7rem; }
      .product-card-body .fs-5 { font-size: 1rem !important; }
    }
  </style>
</head>
<body>
  <div id="app-shell"></div>

  <div class="content-container">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div>
        <h2 class="fw-bold mb-1">Champions Pro Shop</h2>
        <p class="text-muted mb-0">Rackets, footwear, apparel and accessories with member discount perks.</p>
      </div>
      <button class="btn btn-outline-primary position-relative" data-bs-toggle="offcanvas" data-bs-target="#cartDrawer">
        <i class="bi bi-cart3 me-1"></i> Cart
        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cartBadge" style="display:none;">0</span>
      </button>
    </div>

    <!-- Filters & Search Toolbar -->
    <div class="card border-0 shadow-sm p-3 mb-4">
      <div class="row g-2 align-items-center">
        <div class="col-md-6">
          <div class="search-input-wrap">
            <i class="bi bi-search search-icon"></i>
            <input type="search" class="form-control" id="shopSearchInput" placeholder="Search gear (Yonex, Astrox, Shoes, Grips...)" aria-label="Search pro shop">
          </div>
        </div>
        <div class="col-md-3">
          <select class="form-select" id="shopCategoryFilter">
            <option value="">All Categories</option>
            <option value="Rackets">Rackets</option>
            <option value="Footwear">Footwear</option>
            <option value="Apparel">Apparel</option>
            <option value="Accessories">Accessories</option>
            <option value="Strings">Strings & Grips</option>
          </select>
        </div>
        <div class="col-md-3">
          <select class="form-select" id="shopSortSelect">
            <option value="featured">Featured First</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Products Catalog Grid -->
    <div class="product-grid" id="productGrid">
      <!-- Injected via JS -->
    </div>
  </div>

  <!-- Cart Offcanvas Drawer -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="cartDrawer" style="width: 420px;">
    <div class="offcanvas-header border-bottom">
      <h5 class="offcanvas-title fw-bold"><i class="bi bi-bag-check me-2 text-primary"></i>Shopping Cart</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column">
      <div class="flex-grow-1 overflow-y-auto" id="cartDrawerItems">
        <div class="text-center py-5 text-muted">
          <i class="bi bi-cart-x fs-1 d-block mb-2 text-dim"></i>
          Your shopping cart is empty
        </div>
      </div>

      <div class="border-top pt-3 mt-auto">
        <div class="d-flex justify-content-between text-muted small mb-1">
          <span>Subtotal</span>
          <span id="drawerSubtotal" class="font-monospace">₹0</span>
        </div>
        <div class="d-flex justify-content-between text-success small mb-1">
          <span>Member Discount</span>
          <span id="drawerDiscount" class="font-monospace">-₹0</span>
        </div>
        <div class="d-flex justify-content-between fw-bold fs-5 mb-3">
          <span>Total</span>
          <span id="drawerTotal" class="font-monospace text-primary">₹0</span>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold">Fulfilment Method</label>
          <div class="d-flex gap-2">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="fulfilment" id="fulfilmentPickup" value="pickup" checked onchange="toggleDeliveryAddress()">
              <label class="form-check-label small" for="fulfilmentPickup">Club Store Pickup</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="fulfilment" id="fulfilmentDelivery" value="delivery" onchange="toggleDeliveryAddress()">
              <label class="form-check-label small" for="fulfilmentDelivery">Home Delivery</label>
            </div>
          </div>
        </div>

        <div class="mb-3 d-none" id="deliveryAddressWrap">
          <label class="form-label small fw-bold">Delivery Address</label>
          <textarea class="form-control form-control-sm" id="deliveryAddress" rows="2" placeholder="Full residential delivery address"></textarea>
        </div>

        <button class="btn btn-primary w-100 py-2 fw-semibold" id="checkoutBtn" onclick="checkoutOnlineOrder()" disabled>
          <i class="bi bi-credit-card me-1"></i> Place Online Order
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/shell.js"></script>
  <script>
    let productsList = [];
    let cart = [];
    let memberPerkDiscount = 0;

    document.addEventListener('DOMContentLoaded', async () => {
      await loadMemberPerk();
      loadProducts();

      document.getElementById('shopCategoryFilter').addEventListener('change', () => loadProducts());
      document.getElementById('shopSortSelect').addEventListener('change', () => loadProducts());
      document.getElementById('shopSearchInput').addEventListener('input', utils.debounce(() => loadProducts(), 300));
    });

    async function loadMemberPerk() {
      try {
        const res = await api.get('/api/members/me/profile');
        if (res.data) {
          memberPerkDiscount = res.data.discount_pro_shop || 0;
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function loadProducts() {
      const q = document.getElementById('shopSearchInput').value.trim();
      const category = document.getElementById('shopCategoryFilter').value;
      const grid = document.getElementById('productGrid');

      try {
        const res = await api.get('/api/products', { department: 'shop', q, category, limit: 100 });
        productsList = res.data || [];
        renderProducts();
      } catch (err) {
        grid.innerHTML = `<div class="text-danger small">${err.message}</div>`;
      }
    }

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      if (!productsList.length) {
        grid.innerHTML = '<div class="col-12 text-center py-5 text-muted">No gear found matching your search.</div>';
        return;
      }

      grid.innerHTML = productsList.map(p => {
        const isOut = p.stock_quantity <= 0;
        return `
          <div class="product-card ${isOut ? 'opacity-50' : ''}">
            <div class="position-relative">
              <div class="product-image-fallback" aria-hidden="true"><i class="bi bi-bag"></i></div>
              ${p.image_url ? `<img src="${utils.escapeHtml(p.image_url)}" alt="${utils.escapeHtml(p.name)}" class="product-card-img position-absolute top-0 start-0" loading="lazy" onerror="this.remove()">` : ''}
              <span class="position-absolute top-0 end-0 m-2 badge ${isOut ? 'bg-danger' : 'bg-light text-dark border'}">
                ${isOut ? 'Out of Stock' : `${p.stock_quantity} available`}
              </span>
            </div>
            <div class="product-card-body">
              <div>
                <small class="text-muted d-block">${utils.escapeHtml(p.category || 'Gear')}</small>
                <div class="fw-bold text-truncate mb-1" title="${utils.escapeHtml(p.name)}">${utils.escapeHtml(p.name)}</div>
                <small class="text-muted d-block font-monospace mb-2">${p.sku}</small>
              </div>
              <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
                <div class="font-monospace fw-bold text-primary fs-5">${utils.formatINR(p.price)}</div>
                <button class="btn btn-sm btn-primary" ${isOut ? 'disabled' : ''} onclick="addToCart(${p.id})">
                  <i class="bi bi-bag-plus"></i> Add
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function addToCart(productId) {
      const p = productsList.find(i => i.id === productId);
      if (!p || p.stock_quantity <= 0) return;

      const existing = cart.find(i => i.id === productId);
      if (existing) {
        if (existing.qty < p.stock_quantity) {
          existing.qty += 1;
        } else {
          ui.toast('Stock limit reached for this item', 'warning');
        }
      } else {
        cart.push({ id: p.id, name: p.name, price: Number(p.price), qty: 1, maxStock: p.stock_quantity });
      }
      updateCartDrawer();
      ui.toast(`Added ${p.name} to cart`, 'info');
    }

    function updateCartQty(productId, delta) {
      const item = cart.find(i => i.id === productId);
      if (!item) return;

      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(i => i.id !== productId);
      } else if (item.qty > item.maxStock) {
        item.qty = item.maxStock;
        ui.toast('Stock limit reached', 'warning');
      }
      updateCartDrawer();
    }

    function updateCartDrawer() {
      const container = document.getElementById('cartDrawerItems');
      const badge = document.getElementById('cartBadge');
      const totalCount = cart.reduce((sum, i) => sum + i.qty, 0);

      if (totalCount > 0) {
        badge.textContent = totalCount;
        badge.style.display = 'inline-block';
      } else {
        badge.style.display = 'none';
      }

      if (!cart.length) {
        container.innerHTML = `
          <div class="text-center py-5 text-muted">
            <i class="bi bi-cart-x fs-1 d-block mb-2 text-dim"></i>
            Your shopping cart is empty
          </div>
        `;
        document.getElementById('checkoutBtn').disabled = true;
        updateTotals();
        return;
      }

      container.innerHTML = cart.map(i => `
        <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
          <div style="max-width:160px;">
            <div class="fw-semibold small text-truncate">${utils.escapeHtml(i.name)}</div>
            <small class="text-muted font-monospace">${utils.formatINR(i.price)}</small>
          </div>
          <div class="d-flex align-items-center gap-1">
            <button class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="updateCartQty(${i.id}, -1)">-</button>
            <span class="font-monospace small px-1">${i.qty}</span>
            <button class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="updateCartQty(${i.id}, 1)">+</button>
          </div>
          <div class="font-monospace fw-semibold small">${utils.formatINR(i.price * i.qty)}</div>
        </div>
      `).join('');

      document.getElementById('checkoutBtn').disabled = false;
      updateTotals();
    }

    function updateTotals() {
      const subtotal = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      const discountAmount = (subtotal * memberPerkDiscount) / 100;
      const total = Math.max(0, subtotal - discountAmount);

      document.getElementById('drawerSubtotal').textContent = utils.formatINR(subtotal);
      document.getElementById('drawerDiscount').textContent = `-${utils.formatINR(discountAmount)} (${memberPerkDiscount}%)`;
      document.getElementById('drawerTotal').textContent = utils.formatINR(total);
    }

    function toggleDeliveryAddress() {
      const isDelivery = document.getElementById('fulfilmentDelivery').checked;
      const wrap = document.getElementById('deliveryAddressWrap');
      if (isDelivery) {
        wrap.classList.remove('d-none');
      } else {
        wrap.classList.add('d-none');
      }
    }

    async function checkoutOnlineOrder() {
      if (!cart.length) return;

      const isDelivery = document.getElementById('fulfilmentDelivery').checked;
      const address = document.getElementById('deliveryAddress').value.trim();

      if (isDelivery && (!address || address.length < 10)) {
        ui.toast('Please provide a complete delivery address (min 10 chars)', 'warning');
        return;
      }

      const payload = {
        department: 'shop',
        channel: 'online',
        payment_method: 'online',
        delivery_address: isDelivery ? address : undefined,
        items: cart.map(i => ({ product_id: i.id, quantity: i.qty }))
      };

      try {
        const res = await api.post('/api/orders', payload);
        ui.toast(`Order placed successfully! Order Code: ${res.data.order_code}`, 'success');
        cart = [];
        updateCartDrawer();
        bootstrap.Offcanvas.getInstance(document.getElementById('cartDrawer')).hide();
      } catch (err) {
        ui.toast(err.message || 'Checkout failed', 'error');
      }
    }
  </script>
</body>
</html>
