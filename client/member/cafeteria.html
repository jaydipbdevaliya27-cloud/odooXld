<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe & Lounge - Champions Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.25rem;
    }
    .menu-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s ease;
    }
    .menu-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
  </style>
</head>
<body>
  <div id="app-shell"></div>

  <div class="content-container">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div>
        <h2 class="fw-bold mb-1">Cafe & Sports Lounge</h2>
        <p class="text-muted mb-0">Fuel your post-game recovery with nutrition shakes, artisanal coffee and meals.</p>
      </div>
      <button class="btn btn-outline-primary position-relative" data-bs-toggle="offcanvas" data-bs-target="#cafeOrderDrawer">
        <i class="bi bi-cup-hot me-1"></i> My Order
        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cafeOrderBadge" style="display:none;">0</span>
      </button>
    </div>

    <!-- Filter & Search Toolbar -->
    <div class="card border-0 shadow-sm p-3 mb-4">
      <div class="row g-2 align-items-center">
        <div class="col-md-7">
          <div class="search-input-wrap">
            <i class="bi bi-search search-icon"></i>
            <input type="search" class="form-control" id="memberCafeSearch" placeholder="Search menu (Espresso, Protein Shake, Smoothie, Bowl...)" aria-label="Search cafe">
          </div>
        </div>
        <div class="col-md-5">
          <select class="form-select" id="memberCafeCategory">
            <option value="">All Categories</option>
            <option value="Beverages">Beverages & Coffee</option>
            <option value="Snacks">Snacks & Bites</option>
            <option value="Meals">Health Bowls & Meals</option>
            <option value="Protein">Protein & Shakes</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Menu Grid -->
    <div class="menu-grid" id="memberMenuGrid">
      <!-- Injected via JS -->
    </div>
  </div>

  <!-- Cafe Order Drawer -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="cafeOrderDrawer" style="width: 400px;">
    <div class="offcanvas-header border-bottom">
      <h5 class="offcanvas-title fw-bold"><i class="bi bi-receipt me-2 text-primary"></i>Cafe Order</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column">
      <div class="flex-grow-1 overflow-y-auto" id="cafeOrderItems">
        <div class="text-center py-5 text-muted">
          <i class="bi bi-cup-straw fs-1 d-block mb-2 text-dim"></i>
          Your order is empty
        </div>
      </div>

      <div class="border-top pt-3 mt-auto">
        <div class="d-flex justify-content-between text-muted small mb-1">
          <span>Subtotal</span>
          <span id="cafeSubtotal" class="font-monospace">₹0</span>
        </div>
        <div class="d-flex justify-content-between text-success small mb-1">
          <span>Member F&B Discount</span>
          <span id="cafeDiscount" class="font-monospace">-₹0</span>
        </div>
        <div class="d-flex justify-content-between fw-bold fs-5 mb-3">
          <span>Total</span>
          <span id="cafeTotal" class="font-monospace text-primary">₹0</span>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold">Dine-in / Pickup Option</label>
          <select class="form-select form-select-sm" id="memberOrderTable">
            <option value="Takeaway">Express Takeaway Counter</option>
            <option value="Table 1">Lounge Table 1</option>
            <option value="Table 2">Lounge Table 2</option>
            <option value="Table 3">Lounge Table 3</option>
            <option value="Table 4">Lounge Table 4</option>
            <option value="Table 5">Lounge Table 5</option>
          </select>
        </div>

        <button class="btn btn-primary w-100 py-2 fw-semibold" id="sendOrderBtn" onclick="submitCafeOrder()" disabled>
          <i class="bi bi-fire me-1"></i> Send to Kitchen & Pay Online
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/shell.js"></script>
  <script>
    let menuItems = [];
    let cafeOrder = [];
    let memberDiscount = 0;

    document.addEventListener('DOMContentLoaded', async () => {
      await loadMemberProfile();
      loadMenu();

      document.getElementById('memberCafeCategory').addEventListener('change', () => loadMenu());
      document.getElementById('memberCafeSearch').addEventListener('input', utils.debounce(() => loadMenu(), 300));
    });

    async function loadMemberProfile() {
      try {
        const res = await api.get('/api/members/me/profile');
        if (res.data) {
          memberDiscount = res.data.discount_bar || 0;
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function loadMenu() {
      const q = document.getElementById('memberCafeSearch').value.trim();
      const category = document.getElementById('memberCafeCategory').value;
      const grid = document.getElementById('memberMenuGrid');

      try {
        const res = await api.get('/api/products', { department: 'bar', q, category, limit: 100 });
        menuItems = res.data || [];
        renderMenu();
      } catch (err) {
        grid.innerHTML = `<div class="text-danger small">${err.message}</div>`;
      }
    }

    function renderMenu() {
      const grid = document.getElementById('memberMenuGrid');
      if (!menuItems.length) {
        grid.innerHTML = '<div class="col-12 text-center py-5 text-muted">No menu items found.</div>';
        return;
      }

      grid.innerHTML = menuItems.map(item => `
        <div class="menu-card">
          <div>
            <span class="badge bg-light text-dark border mb-2">${utils.escapeHtml(item.category || 'Cafe')}</span>
            <h6 class="fw-bold mb-1">${utils.escapeHtml(item.name)}</h6>
          </div>
          <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
            <span class="fw-bold font-monospace text-primary fs-5">${utils.formatINR(item.price)}</span>
            <button class="btn btn-sm btn-primary" onclick="addToCafeOrder(${item.id})">
              <i class="bi bi-plus-lg"></i> Add
            </button>
          </div>
        </div>
      `).join('');
    }

    function addToCafeOrder(itemId) {
      const item = menuItems.find(i => i.id === itemId);
      if (!item) return;

      const existing = cafeOrder.find(i => i.id === itemId);
      if (existing) {
        existing.qty += 1;
      } else {
        cafeOrder.push({ id: item.id, name: item.name, price: Number(item.price), qty: 1 });
      }
      updateDrawer();
      ui.toast(`Added ${item.name} to order`, 'info');
    }

    function updateOrderQty(itemId, delta) {
      const item = cafeOrder.find(i => i.id === itemId);
      if (!item) return;

      item.qty += delta;
      if (item.qty <= 0) {
        cafeOrder = cafeOrder.filter(i => i.id !== itemId);
      }
      updateDrawer();
    }

    function updateDrawer() {
      const container = document.getElementById('cafeOrderItems');
      const badge = document.getElementById('cafeOrderBadge');
      const totalCount = cafeOrder.reduce((sum, i) => sum + i.qty, 0);

      if (totalCount > 0) {
        badge.textContent = totalCount;
        badge.style.display = 'inline-block';
      } else {
        badge.style.display = 'none';
      }

      if (!cafeOrder.length) {
        container.innerHTML = `
          <div class="text-center py-5 text-muted">
            <i class="bi bi-cup-straw fs-1 d-block mb-2 text-dim"></i>
            Your order is empty
          </div>
        `;
        document.getElementById('sendOrderBtn').disabled = true;
        updateTotals();
        return;
      }

      container.innerHTML = cafeOrder.map(i => `
        <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
          <div style="max-width:160px;">
            <div class="fw-semibold small text-truncate">${utils.escapeHtml(i.name)}</div>
            <small class="text-muted font-monospace">${utils.formatINR(i.price)}</small>
          </div>
          <div class="d-flex align-items-center gap-1">
            <button class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="updateOrderQty(${i.id}, -1)">-</button>
            <span class="font-monospace small px-1">${i.qty}</span>
            <button class="btn btn-sm btn-outline-secondary py-0 px-2" onclick="updateOrderQty(${i.id}, 1)">+</button>
          </div>
          <div class="font-monospace fw-semibold small">${utils.formatINR(i.price * i.qty)}</div>
        </div>
      `).join('');

      document.getElementById('sendOrderBtn').disabled = false;
      updateTotals();
    }

    function updateTotals() {
      const subtotal = cafeOrder.reduce((sum, i) => sum + (i.price * i.qty), 0);
      const discountAmount = (subtotal * memberDiscount) / 100;
      const total = Math.max(0, subtotal - discountAmount);

      document.getElementById('cafeSubtotal').textContent = utils.formatINR(subtotal);
      document.getElementById('cafeDiscount').textContent = `-${utils.formatINR(discountAmount)} (${memberDiscount}%)`;
      document.getElementById('cafeTotal').textContent = utils.formatINR(total);
    }

    async function submitCafeOrder() {
      if (!cafeOrder.length) return;

      const tableNumber = document.getElementById('memberOrderTable').value;
      const payload = {
        department: 'bar',
        channel: 'online',
        table_number: tableNumber,
        payment_method: 'online',
        items: cafeOrder.map(i => ({ product_id: i.id, quantity: i.qty }))
      };

      try {
        const res = await api.post('/api/orders', payload);
        ui.toast(`Order placed! Order Code: ${res.data.order_code}`, 'success');
        cafeOrder = [];
        updateDrawer();
        bootstrap.Offcanvas.getInstance(document.getElementById('cafeOrderDrawer')).hide();
      } catch (err) {
        ui.toast(err.message || 'Failed to place order', 'error');
      }
    }
  </script>
</body>
</html>
