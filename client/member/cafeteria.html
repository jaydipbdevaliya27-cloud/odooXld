<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafeteria & Bar – Champions Club Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>

<body>
  <div class="cc-wrapper">
    <nav class="cc-sidebar d-flex flex-column">
      <div class="brand"><i class="bi bi-trophy-fill me-2 text-warning"></i>Champions Club</div>
      <ul class="nav flex-column mt-2 flex-grow-1">
        <li><a href="/member/dashboard.html" class="nav-link"><i class="bi bi-house"></i>My Dashboard</a></li>
        <li><a href="/member/cafeteria.html" class="nav-link active"><i class="bi bi-cup-hot"></i>Cafeteria & Bar</a>
        </li>
        <li><a href="/member/book.html" class="nav-link"><i class="bi bi-calendar-plus"></i>Book a Court</a></li>
        <li><a href="/member/bookings.html" class="nav-link"><i class="bi bi-calendar-check"></i>My Bookings</a></li>
      </ul>
      <div class="p-3">
        <span id="userNameSidebar" class="small text-muted d-block mb-2"></span>
        <button id="logoutBtn" class="btn btn-sm btn-outline-light w-100"><i
            class="bi bi-box-arrow-right me-1"></i>Logout</button>
      </div>
    </nav>

    <div class="d-flex flex-column flex-grow-1">
      <div class="cc-topbar d-flex justify-content-between align-items-center">
        <h5 class="page-title mb-0"><i class="bi bi-cup-hot me-2 text-cc"></i>Cafeteria & Bar</h5>
        <button class="btn btn-outline-success d-flex align-items-center gap-2 fw-bold px-3 shadow-sm"
          onclick="openCart()">
          <i class="bi bi-cart3"></i> Cart <span class="badge bg-success rounded-pill" id="cartCount">0</span>
        </button>
      </div>

      <main class="cc-main">
        <ul class="nav nav-tabs mb-4" id="cafeteriaTabs" role="tablist">
          <li class="nav-item">
            <button class="nav-link active" id="menu-tab" data-bs-toggle="tab" data-bs-target="#menu" type="button"
              role="tab">Food & Drinks Menu</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" id="orders-tab" data-bs-toggle="tab" data-bs-target="#orders" type="button"
              role="tab">My Orders</button>
          </li>
        </ul>

        <div class="tab-content" id="myTabContent">
          <!-- Menu Tab -->
          <div class="tab-pane fade show active" id="menu" role="tabpanel">
            <div class="row g-3" id="menuGrid">
              <div class="col-12 text-muted">Loading menu...</div>
            </div>
          </div>

          <!-- My Orders Tab -->
          <div class="tab-pane fade" id="orders" role="tabpanel">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h6 class="mb-0">All Orders / History</h6>
              <button class="btn btn-sm btn-outline-secondary" onclick="loadMyOrders()"><i
                  class="bi bi-arrow-clockwise"></i> Refresh</button>
            </div>
            <div class="row g-3" id="myOrdersGrid">
              <div class="col-12 text-muted">Loading my orders...</div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Cart Offcanvas -->
  <div class="offcanvas offcanvas-end shadow-sm" tabindex="-1" id="cartOffcanvas" style="width: 400px;">
    <div class="offcanvas-header border-bottom">
      <h5 class="fw-bold mb-0"><i class="bi bi-cart4 me-2 text-success"></i>My Cart</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column p-0">
      <div id="cartItemsList" class="flex-grow-1 overflow-auto p-3">
        <div class="text-center text-muted mt-5">Your cart is empty.</div>
      </div>
      <div class="border-top p-3 bg-light mt-auto">
        <div class="d-flex justify-content-between align-items-center fw-bold fs-5 mb-3 text-dark">
          <span>Grand Total:</span>
          <span id="cartTotal">₹0</span>
        </div>
        <button class="btn btn-success w-100 py-2 fw-bold shadow-sm" id="checkoutBtn" onclick="checkout()" disabled>
          <i class="bi bi-credit-card me-2"></i>Checkout & Pay
        </button>
      </div>
    </div>
  </div>

  <div id="alert-bar"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script>
    let currentProducts = {};
    let cart = {};
    let cartCanvas;

    (async () => {
      const user = await loadSession();
      if (!user || user.role !== 'member') {
        window.location.href = '/shared/login.html'; return;
      }
      document.getElementById('userNameSidebar').textContent = user.full_name;

      cartCanvas = new bootstrap.Offcanvas(document.getElementById('cartOffcanvas'));

      loadMenu();
      loadMyOrders();

      setInterval(loadMyOrders, 5000);

      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await api.post('/api/auth/logout');
        window.location.href = '/shared/login.html';
      });
    })();

    async function loadMenu() {
      try {
        const products = await api.get('/api/products?dept=bar');
        const container = document.getElementById('menuGrid');
        if (!products.length) {
          container.innerHTML = '<div class="col-12 text-muted">No items available currently.</div>';
          return;
        }

        currentProducts = {};
        container.innerHTML = products.map(p => {
          currentProducts[p.id] = p;
          let parsedImgs = [];
          try { parsedImgs = JSON.parse(p.image_url); } catch (e) { parsedImgs = p.image_url ? [p.image_url] : ['https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&q=80']; }
          if (!Array.isArray(parsedImgs)) parsedImgs = [parsedImgs];
          if (parsedImgs.length === 0) parsedImgs.push('https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&q=80');

          // Carousel logic
          const cid = 'carousel-member-' + p.id;
          let imgHtml = '';
          if (parsedImgs.length > 1) {
            const indicators = parsedImgs.map((img, i) => `<button type="button" data-bs-target="#${cid}" data-bs-slide-to="${i}" ${i===0?'class="active"':''}></button>`).join('');
        const items = parsedImgs.map((img, i) => `
          <div class="carousel-item ${i===0?'active':''}">
            <img src="${escHtml(img)}" class="d-block w-100 rounded border" style="height:140px; object-fit:cover;">
          </div>
        `).join('');
        imgHtml = `
          <div id="${cid}" class="carousel slide mb-3" data-bs-ride="carousel">
            <div class="carousel-indicators">${indicators}</div>
            <div class="carousel-inner">${items}</div>
            <button class="carousel-control-prev" type="button" data-bs-target="#${cid}" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
            <button class="carousel-control-next" type="button" data-bs-target="#${cid}" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
          </div>
        `;
      } else {
        imgHtml = `<img src="${escHtml(parsedImgs[0])}" alt="${escHtml(p.name)}" class="img-fluid rounded border mb-3" style="height:140px; object-fit:cover; width:100%;">`;
      }

      return `
      <div class="col-md-6 col-lg-3">
        <div class="cc-card h-100 d-flex flex-column text-center p-3 shadow-sm border-0 bg-white rounded-3">
          ${imgHtml}
          <h6 class="mb-1 fw-bold text-dark">${escHtml(p.name)}</h6>
          <p class="small text-muted mb-3">${escHtml(p.category)}</p>
          <div class="d-flex justify-content-between align-items-center mt-auto">
             <h5 class="text-success fw-bold mb-0">${fmtINR(Number(p.price))}</h5>
             <button class="btn btn-sm btn-outline-success fw-bold px-3 shadow-sm rounded-pill" onclick="addToCart(${p.id})"><i class="bi bi-cart-plus"></i> Add</button>
          </div>
        </div>
      </div>
      `;
    }).join('');
  } catch(e) {
    if(window.showAlert) showAlert('Failed to load menu', 'danger');
  }
}

function openCart() {
  cartCanvas.show();
}

function addToCart(id) {
  if (cart[id]) {
    cart[id].quantity += 1;
  } else {
    cart[id] = { ...currentProducts[id], quantity: 1 };
  }
  updateCartUI();
  
  const toastWrapper = document.getElementById('alert-bar');
  const alertNode = document.createElement('div');
  alertNode.className = `alert alert-success alert-dismissible fade show m-3 shadow-sm`;
  alertNode.innerHTML = `<i class="bi bi-check-circle-fill me-2"></i>Added ${escHtml(currentProducts[id].name)} to cart. <button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
  toastWrapper.appendChild(alertNode);
  setTimeout(() => alertNode.remove(), 2500);
}

function updateCartQty(id, delta) {
  if(!cart[id]) return;
  cart[id].quantity += delta;
  if (cart[id].quantity <= 0) {
    delete cart[id];
  }
  updateCartUI();
}

function updateCartUI() {
  const container = document.getElementById('cartItemsList');
  const items = Object.values(cart);
  
  let totalQty = 0;
  let totalPrice = 0;
  
  if (items.length === 0) {
    container.innerHTML = '<div class="text-center text-muted mt-5"><i class="bi bi-cart-x fs-1 opacity-50 mb-3 block"></i><br>Your cart is empty.</div>';
    document.getElementById('cartCount').textContent = '0';
    document.getElementById('cartTotal').textContent = '₹0';
    document.getElementById('checkoutBtn').disabled = true;
    return;
  }
  
  let html = '';
  items.forEach(item => {
    totalQty += item.quantity;
    totalPrice += (item.price * item.quantity);
    
    let parsedImgs = [];
    try { parsedImgs = JSON.parse(item.image_url); } catch(e) { parsedImgs = item.image_url ? [item.image_url] : ['https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&q=80']; }
    if(!Array.isArray(parsedImgs)) parsedImgs = [parsedImgs];
    if(parsedImgs.length === 0) parsedImgs.push('https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&q=80');

    html += `
      <div class="d-flex align-items-center mb-3 p-2 border rounded bg-white shadow-sm">
        <img src="${escHtml(parsedImgs[0])}" class="rounded me-3 object-fit-cover border" style="width: 60px; height: 60px;">
        <div class="flex-grow-1">
          <h6 class="mb-1 text-dark fw-bold" style="font-size: 14px;">${escHtml(item.name)}</h6>
          <div class="text-success fw-bold small">${fmtINR(Number(item.price))}</div>
        </div>
        <div class="d-flex align-items-center flex-shrink-0">
           <button class="btn btn-sm btn-light border p-1 d-flex align-items-center justify-content-center text-dark" style="width:25px;height:25px;" onclick="updateCartQty(${item.id}, -1)">
             <i class="bi bi-dash"></i>
           </button>
           <span class="mx-2 fw-bold">${item.quantity}</span>
           <button class="btn btn-sm btn-light border p-1 d-flex align-items-center justify-content-center text-dark" style="width:25px;height:25px;" onclick="updateCartQty(${item.id}, 1)">
             <i class="bi bi-plus"></i>
           </button>
        </div>
      </div>
    `;
  });
  
  container.innerHTML = html;
  document.getElementById('cartCount').textContent = totalQty;
  document.getElementById('cartTotal').textContent = fmtINR(totalPrice);
  document.getElementById('checkoutBtn').disabled = false;
}

async function checkout() {
  const items = Object.values(cart);
  if(items.length === 0) return;
  
  if(!confirm('This will simulate a collective payment for your cart. Proceed?')) return;
  const orderItems = items.map(i => ({ productId: i.id, quantity: i.quantity }));
  
  try {
    document.getElementById('checkoutBtn').innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Processing...';
    document.getElementById('checkoutBtn').disabled = true;

    await api.post('/api/orders', {
      department: 'bar',
      channel: 'online',
      items: orderItems
    });
    
    if(window.showAlert) showAlert('Payment successful & Order placed!', 'success');
    cart = {}; // wipe cart
    updateCartUI();
    cartCanvas.hide();
    
    loadMyOrders();
    const tabTrigger = new bootstrap.Tab(document.querySelector('#orders-tab'));
    tabTrigger.show();
  } catch(e) {
    document.getElementById('checkoutBtn').innerHTML = '<i class="bi bi-credit-card me-2"></i>Checkout & Pay';
    document.getElementById('checkoutBtn').disabled = false;
    if(window.showAlert) showAlert(e.message || 'Error checking out', 'danger');
  }
}

async function loadMyOrders() {
  try {
    const orders = await api.get('/api/orders?dept=bar');
    const container = document.getElementById('myOrdersGrid');
    if (!orders.length) {
      container.innerHTML = '<div class="col-12 text-muted text-center mt-5"><i class="bi bi-receipt fs-1 d-block mb-3 opacity-50"></i>You have no ongoing or recent orders.</div>';
      return;
    }
    
    let html = '';
    for(const o of orders) {
      let details;
      try { details = await api.get('/api/orders/' + o.id); } catch(e) { continue; }
      const itemsHtml = details.items.map(i => `<li class="mb-1"><span class="badge bg-secondary rounded-pill me-2">${i.quantity}x</span> ${escHtml(i.product_name)}</li>`).join('');
      let statusHtml = '';
      if(o.status === 'open') {
        statusHtml = '<span class="badge bg-warning text-dark"><i class="bi bi-hourglass-split me-1"></i> Preparing</span>';
      } else if (o.status === 'completed') {
        statusHtml = '<span class="badge bg-success"><i class="bi bi-check-circle me-1"></i> Ready</span>';
      } else {
        statusHtml = '<span class="badge bg-danger"><i class="bi bi-x-circle me-1"></i> Cancelled</span>';
      }
      
      html += `
       <div class="col-md-6 col-lg-4">
         <div class="cc-card h-100 d-flex flex-column shadow-sm border-0 bg-white">
           <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
             <strong class="text-dark">${escHtml(o.order_code)}</strong>
             ${statusHtml}
           </div>
           <ul class="mb-3 ps-0 list-unstyled flex-grow-1 text-muted small">
             ${itemsHtml}
           </ul>
           <div class="text-end fw-bold text-success border-top pt-3 mt-auto">
              Total Paid: ${fmtINR(Number(o.total))}
           </div>
         </div>
       </div>
      `;
    }
    container.innerHTML = html;
  } catch(e) {
    console.error('Failed to load my orders', e);
  }
}
  </script>
</body>

</html>
