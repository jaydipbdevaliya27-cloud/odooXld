<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us – Champions Club</title>
  <meta name="description" content="Interested in joining Champions Club? Send us a message and we will get back to you.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="login-page">

  <div class="login-card" style="max-width:480px">
    <div class="logo-area">
      <i class="bi bi-trophy-fill text-cc" style="font-size:2.5rem"></i>
      <h2>Champions Club</h2>
      <p class="text-muted small">Express your interest – we'll be in touch!</p>
    </div>

    <div id="successMsg" class="alert alert-success d-none">
      <i class="bi bi-check-circle-fill me-2"></i>
      Thank you! A staff member will contact you shortly.
    </div>

    <form id="contactForm" novalidate>
      <div class="mb-3">
        <label class="form-label fw-semibold">Full Name *</label>
        <input type="text" id="name" class="form-control" placeholder="Your name" required>
      </div>
      <div class="row g-2 mb-3">
        <div class="col">
          <label class="form-label fw-semibold">Email</label>
          <input type="email" id="email" class="form-control" placeholder="you@mail.com">
        </div>
        <div class="col">
          <label class="form-label fw-semibold">Phone</label>
          <input type="tel" id="phone" class="form-control" placeholder="9xxxxxxxxx">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Interested Plan</label>
        <select id="planSelect" class="form-select">
          <option value="">-- Loading plans... --</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Message</label>
        <textarea id="message" class="form-control" rows="3" placeholder="Tell us what you're looking for"></textarea>
      </div>
      <div id="errDiv" class="alert alert-danger d-none small py-2"></div>
      <button type="submit" id="submitBtn" class="btn btn-cc w-100 fw-semibold">
        <span id="spinner" class="spinner-border spinner-sm d-none me-1"></span>
        Send Message
      </button>
    </form>

    <p class="text-center text-muted small mt-3 mb-0">
      Already a member? <a href="/shared/login.html" class="text-cc fw-semibold">Sign In</a>
    </p>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // Load plans into the select dropdown
    async function loadPlans() {
      try {
        const plans = await api.get('/api/plans');
        const sel   = document.getElementById('planSelect');
        sel.innerHTML = '<option value="">-- Select a plan --</option>';
        plans.forEach(p => {
          sel.insertAdjacentHTML('beforeend',
            `<option value="${p.id}">${p.name} – ₹${Number(p.annual_fee).toLocaleString('en-IN')}/yr</option>`);
        });
      } catch { /* silently ignore if plans fail */ }
    }

    document.getElementById('contactForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn     = document.getElementById('submitBtn');
      const spinner = document.getElementById('spinner');
      const errDiv  = document.getElementById('errDiv');
      const name    = document.getElementById('name').value.trim();
      if (!name) { errDiv.textContent = 'Name is required.'; errDiv.classList.remove('d-none'); return; }

      btn.disabled = true;
      spinner.classList.remove('d-none');
      errDiv.classList.add('d-none');

      try {
        await api.post('/api/leads', {
          name,
          email:              document.getElementById('email').value.trim() || undefined,
          phone:              document.getElementById('phone').value.trim() || undefined,
          interested_plan_id: document.getElementById('planSelect').value   || undefined,
          message:            document.getElementById('message').value.trim() || undefined
        });
        document.getElementById('contactForm').classList.add('d-none');
        document.getElementById('successMsg').classList.remove('d-none');
      } catch (err) {
        errDiv.textContent = err.message || 'Failed to send message. Please try again.';
        errDiv.classList.remove('d-none');
        btn.disabled = false;
        spinner.classList.add('d-none');
      }
    });

    loadPlans();
  </script>
</body>
</html>
