<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Champions Club</title>
  <meta name="description" content="Sign in to the Champions Club Management System">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="login-page">

  <div class="login-card">
    <!-- Logo / Branding -->
    <div class="logo-area">
      <i class="bi bi-trophy-fill text-cc" style="font-size:2.5rem"></i>
      <h2>Champions Club</h2>
      <p class="text-muted small">Management System</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label fw-semibold">Email address</label>
        <input type="email" id="email" name="email" class="form-control"
               placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <input type="password" id="password" name="password" class="form-control"
                 placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="btn btn-outline-secondary" id="togglePw" tabindex="-1"
                  aria-label="Toggle password visibility">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <div id="loginError" class="alert alert-danger d-none small py-2"></div>

      <button type="submit" id="loginBtn" class="btn btn-cc w-100 py-2 fw-semibold">
        <span id="loginSpinner" class="spinner-border spinner-sm d-none me-1" role="status"></span>
        Sign In
      </button>

      <button type="button" id="quickShopDemoBtn" class="btn btn-outline-success w-100 py-2 fw-semibold mt-2">
        <i class="bi bi-shop me-1"></i> Quick Shop Dashboard Demo (1-Click)
      </button>

      <div class="mt-3 p-2 bg-light rounded text-center small">
        <span class="text-muted d-block mb-1">1-Click Test Credentials:</span>
        <button type="button" class="badge bg-success border-0 me-1" onclick="fillDemo('shop@championsclub.com')">Shop Staff</button>
        <button type="button" class="badge bg-warning text-dark border-0 me-1" onclick="fillDemo('bar@championsclub.com')">Bar Staff</button>
        <button type="button" class="badge bg-info text-dark border-0 me-1" onclick="fillDemo('booking@championsclub.com')">Booking Staff</button>
        <button type="button" class="badge bg-primary border-0 me-1" onclick="fillDemo('owner@championsclub.com')">Owner</button>
        <button type="button" class="badge bg-secondary border-0" onclick="fillDemo('member@championsclub.com')">Member</button>
      </div>
    </form>

    <hr class="my-3">
    <p class="text-center text-muted small mb-0">
      Not a member yet?
      <a href="/shared/contact.html" class="text-cc fw-semibold">Contact us</a>
    </p>
  </div>

  <script src="/js/api.js"></script>
  <script>
    function fillDemo(email) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = 'password123';
    }

    // ── 1-Click Quick Demo Login ─────────────────────────────────────────────
    document.getElementById('quickShopDemoBtn').addEventListener('click', async () => {
      const btn = document.getElementById('quickShopDemoBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Launching Shop...';
      try {
        await api.post('/api/auth/demo-login', { role: 'staff', assigned_area: 'shop' });
        window.location.href = '/staff/shop-dashboard.html';
      } catch {
        window.location.href = '/staff/shop-dashboard.html';
      }
    });

    // ── Toggle password visibility ──────────────────────────────────────────
    document.getElementById('togglePw').addEventListener('click', () => {
      const pw  = document.getElementById('password');
      const eye = document.getElementById('eyeIcon');
      if (pw.type === 'password') {
        pw.type = 'text';
        eye.className = 'bi bi-eye-slash';
      } else {
        pw.type = 'password';
        eye.className = 'bi bi-eye';
      }
    });

    // ── Login form submit ───────────────────────────────────────────────────
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn     = document.getElementById('loginBtn');
      const spinner = document.getElementById('loginSpinner');
      const errEl   = document.getElementById('loginError');

      btn.disabled    = true;
      spinner.classList.remove('d-none');
      errEl.classList.add('d-none');

      try {
        const data = await api.post('/api/auth/login', {
          email:    document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        });

        // Redirect based on role and assigned operational area
        const role = data.user.role;
        if (role === 'owner') {
          window.location.href = '/owner/dashboard.html';
        } else if (role === 'staff') {
          const area = data.user.assigned_area || 'shop';
          if (area === 'shop') {
            window.location.href = '/staff/shop-dashboard.html';
          } else if (area === 'bar') {
            window.location.href = '/staff/bar-dashboard.html';
          } else {
            window.location.href = '/staff/dashboard.html';
          }
        } else {
          window.location.href = '/member/dashboard.html';
        }
      } catch (err) {
        errEl.textContent = err.message || 'Login failed. Please try again.';
        errEl.classList.remove('d-none');
        btn.disabled = false;
        spinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
