<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Champions Club</title>
  <meta name="description" content="Sign in to the Champions Club Management System">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="login-page">

  <div class="login-card">
    <!-- Logo / Branding -->
    <div class="logo-area">
      <div class="d-inline-flex p-3 rounded-circle bg-success bg-opacity-10 text-success mb-2">
        <i class="bi bi-trophy-fill" style="font-size: 2.2rem;"></i>
      </div>
      <h2>Champions Club</h2>
      <p class="text-muted small mb-0">Sports Complex & Club Management System</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
          <input type="email" id="email" name="email" class="form-control border-start-0"
                 placeholder="name@championsclub.com" required autocomplete="email">
        </div>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label for="password" class="form-label mb-0">Password</label>
          <span class="small text-muted" style="font-size: 0.76rem;">Default: <code>password123</code></span>
        </div>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
          <input type="password" id="password" name="password" class="form-control border-start-0 border-end-0"
                 placeholder="••••••••" required autocomplete="current-password" value="password123">
          <button type="button" class="btn btn-outline-secondary" id="togglePw" tabindex="-1"
                  aria-label="Toggle password visibility">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <div id="loginError" class="alert alert-danger d-none small py-2"></div>

      <button type="submit" id="loginBtn" class="btn btn-cc w-100 py-2 fw-bold mb-3">
        <span id="loginSpinner" class="spinner-border spinner-border-sm d-none me-1" role="status"></span>
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
      </button>

      <!-- Credentials Quick Click Section -->
      <div class="credentials-box mb-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="fw-bold text-dark small"><i class="bi bi-key me-1 text-warning"></i>Quick 1-Click Fill Credentials:</span>
        </div>
        
        <div class="d-grid gap-2">
          <button type="button" class="btn btn-sm btn-outline-primary text-start d-flex justify-content-between align-items-center" onclick="fillDemo('admin@championsclub.com', 'owner')">
            <span><i class="bi bi-shield-check me-2"></i><strong>Admin / Owner</strong></span>
            <span class="badge bg-primary">Admin Panel</span>
          </button>
          
          <button type="button" class="btn btn-sm btn-outline-success text-start d-flex justify-content-between align-items-center" onclick="fillDemo('shop@championsclub.com', 'shop')">
            <span><i class="bi bi-shop me-2"></i><strong>Pro Shop Staff</strong></span>
            <span class="badge bg-success">Shop POS</span>
          </button>
          
          <button type="button" class="btn btn-sm btn-outline-warning text-dark text-start d-flex justify-content-between align-items-center" onclick="fillDemo('bar@championsclub.com', 'bar')">
            <span><i class="bi bi-cup-hot me-2"></i><strong>Bar & Cafe Staff</strong></span>
            <span class="badge bg-warning text-dark">Bar POS</span>
          </button>

          <button type="button" class="btn btn-sm btn-outline-info text-dark text-start d-flex justify-content-between align-items-center" onclick="fillDemo('booking@championsclub.com', 'booking')">
            <span><i class="bi bi-calendar-check me-2"></i><strong>Court Booking Staff</strong></span>
            <span class="badge bg-info text-dark">Court Desk</span>
          </button>

          <button type="button" class="btn btn-sm btn-outline-secondary text-start d-flex justify-content-between align-items-center" onclick="fillDemo('member@championsclub.com', 'member')">
            <span><i class="bi bi-person me-2"></i><strong>Club Member (Ravi)</strong></span>
            <span class="badge bg-secondary">Member Portal</span>
          </button>
        </div>
      </div>
    </form>

    <div class="text-center text-muted small pt-2 border-top">
      Champions Club Multi-Role Management Platform
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    function fillDemo(email, role) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = 'password123';
      const btn = document.getElementById('loginBtn');
      btn.classList.add('shadow');
      setTimeout(() => btn.classList.remove('shadow'), 300);
    }

    // ── Toggle password visibility ──────────────────────────────────────────
    document.getElementById('togglePw').addEventListener('click', () => {
      const pw  = document.getElementById('password');
      const eye = document.getElementById('eyeIcon');
      if (pw.type === 'password') {
        pw.type = 'text';
        eye.className = 'bi bi-eye-slash';
      } else {
        pw.type = 'password';
        eye.className = 'bi bi-eye';
      }
    });

    // ── Login form submit ───────────────────────────────────────────────────
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn     = document.getElementById('loginBtn');
      const spinner = document.getElementById('loginSpinner');
      const errEl   = document.getElementById('loginError');

      btn.disabled    = true;
      spinner.classList.remove('d-none');
      errEl.classList.add('d-none');

      try {
        const data = await api.post('/api/auth/login', {
          email:    document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        });

        // Redirect based on role and assigned operational area
        const role = data.user.role;
        if (role === 'owner') {
          window.location.href = '/owner/dashboard.html';
        } else if (role === 'staff') {
          const area = data.user.assigned_area || 'shop';
          if (area === 'shop') {
            window.location.href = '/staff/shop-dashboard.html';
          } else if (area === 'bar') {
            window.location.href = '/staff/bar-dashboard.html';
          } else {
            window.location.href = '/staff/dashboard.html';
          }
        } else {
          window.location.href = '/member/dashboard.html';
        }
      } catch (err) {
        errEl.textContent = err.message || 'Login failed. Please check credentials.';
        errEl.classList.remove('d-none');
        btn.disabled = false;
        spinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
