<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Members – Champions Club</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="cc-wrapper">
  <!-- Sidebar (same as dashboard) -->
  <nav class="cc-sidebar d-flex flex-column">
    <div class="brand"><i class="bi bi-trophy-fill me-2 text-warning"></i>Champions Club</div>
    <ul class="nav flex-column mt-2 flex-grow-1">
      <li><a href="/owner/dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i>Dashboard</a></li>
      <li><a href="/owner/staff.html"     class="nav-link"><i class="bi bi-person-badge"></i>Staff Management</a></li>
      <li><a href="/owner/members.html"   class="nav-link active"><i class="bi bi-people"></i>Members</a></li>
      <li><a href="/owner/bookings.html"  class="nav-link"><i class="bi bi-calendar-check"></i>Bookings</a></li>
      <li><a href="/owner/orders.html"    class="nav-link"><i class="bi bi-bag"></i>Orders</a></li>
      <li><a href="/owner/products.html"  class="nav-link"><i class="bi bi-box-seam"></i>Products</a></li>
      <li><a href="/owner/payments.html"  class="nav-link"><i class="bi bi-credit-card"></i>Payments</a></li>
      <li><a href="/owner/leads.html"     class="nav-link"><i class="bi bi-person-plus"></i>Leads</a></li>
      <li><a href="/owner/plans.html"     class="nav-link"><i class="bi bi-stars"></i>Plans</a></li>
      <li><a href="/owner/courts.html"    class="nav-link"><i class="bi bi-geo-alt"></i>Courts</a></li>
    </ul>
    <div class="p-3">
      <span id="userNameSidebar" class="small text-muted d-block mb-2"></span>
      <button id="logoutBtn" class="btn btn-sm btn-outline-light w-100"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
    </div>
  </nav>

  <div class="d-flex flex-column flex-grow-1">
    <div class="cc-topbar">
      <h5 class="page-title"><i class="bi bi-people me-2 text-cc"></i>Members</h5>
      <button class="btn btn-cc btn-sm" data-bs-toggle="modal" data-bs-target="#enrollModal">
        <i class="bi bi-person-plus-fill me-1"></i>Enroll Member
      </button>
    </div>

    <main class="cc-main">
      <!-- Filters -->
      <div class="cc-card mb-3">
        <div class="row g-2 align-items-end">
          <div class="col-md-5">
            <label class="form-label small fw-semibold">Search</label>
            <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Name, email, code…">
          </div>
          <div class="col-md-3">
            <label class="form-label small fw-semibold">Status</label>
            <select id="statusFilter" class="form-select form-select-sm">
              <option value="">All</option>
              <option value="active">Active</option>
              <option value="expired">Expired</option>
              <option value="suspended">Suspended</option>
            </select>
          </div>
          <div class="col-md-2">
            <button id="filterBtn" class="btn btn-cc btn-sm w-100">Filter</button>
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="cc-card">
        <div class="table-responsive">
          <table class="table table-hover mb-0" id="membersTable">
            <thead>
              <tr>
                <th>Code</th><th>Name</th><th>Plan</th>
                <th>Status</th><th>Expiry</th><th>Actions</th>
              </tr>
            </thead>
            <tbody><tr><td colspan="6" class="text-center py-4 text-muted">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- ── Enroll Modal ───────────────────────────────────────────────────────── -->
<div class="modal fade" id="enrollModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-person-plus-fill me-2 text-cc"></i>Enroll New Member</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="enrollForm" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Full Name *</label>
              <input type="text" id="e_name" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Email *</label>
              <input type="email" id="e_email" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input type="tel" id="e_phone" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Date of Birth</label>
              <input type="date" id="e_dob" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Plan *</label>
              <select id="e_plan" class="form-select" required></select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Payment Method *</label>
              <select id="e_pay_method" class="form-select" required>
                <option value="cash">Cash</option>
                <option value="card">Card</option>
                <option value="upi">UPI</option>
                <option value="online">Online</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Password (for login)</label>
              <input type="text" id="e_password" class="form-control" placeholder="Champions@123">
            </div>
            <div class="col-md-6">
              <label class="form-label">Emergency Contact</label>
              <input type="text" id="e_emg" class="form-control" placeholder="Name – Phone">
            </div>
          </div>
          <div id="enrollErr" class="alert alert-danger mt-3 d-none small py-2"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" id="enrollSaveBtn" class="btn btn-cc">
          <span id="enrollSpinner" class="spinner-border spinner-sm d-none me-1"></span>
          Enroll & Pay
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ── Renew Modal ────────────────────────────────────────────────────────── -->
<div class="modal fade" id="renewModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Renew Membership</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="r_memberId">
        <div class="mb-3">
          <label class="form-label">Plan</label>
          <select id="r_plan" class="form-select"></select>
        </div>
        <div class="mb-3">
          <label class="form-label">Payment Method</label>
          <select id="r_pay" class="form-select">
            <option value="cash">Cash</option>
            <option value="card">Card</option>
            <option value="upi">UPI</option>
            <option value="online">Online</option>
          </select>
        </div>
        <div id="renewErr" class="alert alert-danger d-none small py-2"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" id="renewSaveBtn" class="btn btn-cc">Renew</button>
      </div>
    </div>
  </div>
</div>

<div id="alert-bar"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script>
let plans = [];

async function loadPlans() {
  plans = await api.get('/api/plans?all=1');
  const opts = plans.map(p => ({ value: p.id, label: `${p.name} (₹${Number(p.annual_fee).toLocaleString('en-IN')})` }));
  fillSelect(document.getElementById('e_plan'), opts, '-- Select Plan --');
  fillSelect(document.getElementById('r_plan'), opts, '-- Select Plan --');
}

async function loadMembers() {
  const search   = document.getElementById('searchInput').value.trim();
  const status   = document.getElementById('statusFilter').value;
  let url = '/api/members?page=1';
  if (search) url += '&search=' + encodeURIComponent(search);
  if (status) url += '&status=' + status;

  const data = await api.get(url).catch(() => []);
  const tbody = document.querySelector('#membersTable tbody');

  if (!data.members || !data.members.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No members found</td></tr>';
    return;
  }
  tbody.innerHTML = data.members.map(m => `
    <tr>
      <td><code>${escHtml(m.member_code)}</code></td>
      <td>${escHtml(m.full_name)}<br><small class="text-muted">${escHtml(m.email)}</small></td>
      <td>${escHtml(m.plan_name || '—')}</td>
      <td>${statusBadge(m.status)}</td>
      <td>${fmtDate(m.expiry_date)}</td>
      <td>
        <button class="btn btn-sm btn-outline-primary me-1 btn-renew"
                data-id="${m.id}" data-plan="${m.plan_id}">Renew</button>
      </td>
    </tr>`).join('');

  // Bind renew buttons
  document.querySelectorAll('.btn-renew').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById('r_memberId').value = btn.dataset.id;
      document.getElementById('r_plan').value     = btn.dataset.plan || '';
      new bootstrap.Modal(document.getElementById('renewModal')).show();
    });
  });
}

(async () => {
  const user = await loadSession();
  if (!user || (user.role !== 'owner' && user.role !== 'staff')) {
    window.location.href = '/shared/login.html'; return;
  }
  document.getElementById('userNameSidebar').textContent = user.full_name;

  await loadPlans();
  await loadMembers();

  document.getElementById('filterBtn').addEventListener('click', loadMembers);
  document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key==='Enter') loadMembers(); });

  // ── Enroll submit ───────────────────────────────────────────────────────
  document.getElementById('enrollSaveBtn').addEventListener('click', async () => {
    const btn = document.getElementById('enrollSaveBtn');
    const sp  = document.getElementById('enrollSpinner');
    const err = document.getElementById('enrollErr');
    err.classList.add('d-none');
    btn.disabled = true; sp.classList.remove('d-none');

    const emg = document.getElementById('e_emg').value.split('–').map(s => s.trim());
    try {
      await api.post('/api/members', {
        full_name:              document.getElementById('e_name').value.trim(),
        email:                  document.getElementById('e_email').value.trim(),
        phone:                  document.getElementById('e_phone').value.trim() || undefined,
        date_of_birth:          document.getElementById('e_dob').value  || undefined,
        plan_id:                document.getElementById('e_plan').value,
        payment_method:         document.getElementById('e_pay_method').value,
        password:               document.getElementById('e_password').value || 'Champions@123',
        emergency_contact_name: emg[0] || undefined,
        emergency_contact_phone:emg[1] || undefined
      });
      bootstrap.Modal.getInstance(document.getElementById('enrollModal')).hide();
      document.getElementById('enrollForm').reset();
      showAlert('Member enrolled successfully!');
      loadMembers();
    } catch (e) {
      err.textContent = e.message;
      err.classList.remove('d-none');
    } finally {
      btn.disabled = false; sp.classList.add('d-none');
    }
  });

  // ── Renew submit ────────────────────────────────────────────────────────
  document.getElementById('renewSaveBtn').addEventListener('click', async () => {
    const id  = document.getElementById('r_memberId').value;
    const err = document.getElementById('renewErr');
    err.classList.add('d-none');
    try {
      await api.post(`/api/members/${id}/renew`, {
        plan_id:        document.getElementById('r_plan').value,
        payment_method: document.getElementById('r_pay').value
      });
      bootstrap.Modal.getInstance(document.getElementById('renewModal')).hide();
      showAlert('Membership renewed!');
      loadMembers();
    } catch (e) {
      err.textContent = e.message;
      err.classList.remove('d-none');
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await api.post('/api/auth/logout');
    window.location.href = '/shared/login.html';
  });
})();
</script>
</body>
</html>
