<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payments – Champions Club</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="cc-wrapper">
  <nav class="cc-sidebar d-flex flex-column">
    <div class="brand"><i class="bi bi-trophy-fill me-2 text-warning"></i>Champions Club</div>
    <ul class="nav flex-column mt-2 flex-grow-1">
      <li><a href="/owner/dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i>Dashboard</a></li>
      <li><a href="/owner/members.html"   class="nav-link"><i class="bi bi-people"></i>Members</a></li>
      <li><a href="/owner/bookings.html"  class="nav-link"><i class="bi bi-calendar-check"></i>Bookings</a></li>
      <li><a href="/owner/orders.html"    class="nav-link"><i class="bi bi-bag"></i>Orders</a></li>
      <li><a href="/owner/products.html"  class="nav-link"><i class="bi bi-box-seam"></i>Products</a></li>
      <li><a href="/owner/payments.html"  class="nav-link active"><i class="bi bi-credit-card"></i>Payments</a></li>
      <li><a href="/owner/leads.html"     class="nav-link"><i class="bi bi-person-plus"></i>Leads</a></li>
      <li><a href="/owner/plans.html"     class="nav-link"><i class="bi bi-stars"></i>Plans</a></li>
      <li><a href="/owner/courts.html"    class="nav-link"><i class="bi bi-geo-alt"></i>Courts</a></li>
    </ul>
    <div class="p-3"><span id="userNameSidebar" class="small text-muted d-block mb-2"></span>
      <button id="logoutBtn" class="btn btn-sm btn-outline-light w-100"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
    </div>
  </nav>

  <div class="d-flex flex-column flex-grow-1">
    <div class="cc-topbar">
      <h5 class="page-title"><i class="bi bi-credit-card me-2 text-cc"></i>Payment Ledger</h5>
    </div>

    <main class="cc-main">
      <!-- Filters -->
      <div class="cc-card mb-3">
        <div class="row g-2 align-items-end">
          <div class="col-md-2">
            <label class="form-label small fw-semibold">From</label>
            <input type="date" id="fromDate" class="form-control form-control-sm">
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-semibold">To</label>
            <input type="date" id="toDate" class="form-control form-control-sm">
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-semibold">Source</label>
            <select id="sourceFilter" class="form-select form-select-sm">
              <option value="">All</option>
              <option value="membership">Membership</option>
              <option value="court">Court</option>
              <option value="shop">Shop</option>
              <option value="bar">Bar</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-semibold">Method</label>
            <select id="methodFilter" class="form-select form-select-sm">
              <option value="">All</option>
              <option value="cash">Cash</option>
              <option value="card">Card</option>
              <option value="upi">UPI</option>
              <option value="online">Online</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-semibold">Status</label>
            <select id="statusFilter" class="form-select form-select-sm">
              <option value="">All</option>
              <option value="paid">Paid</option>
              <option value="refunded">Refunded</option>
            </select>
          </div>
          <div class="col-md-2">
            <button id="filterBtn" class="btn btn-cc btn-sm w-100">Filter</button>
          </div>
        </div>
      </div>

      <!-- Summary row -->
      <div class="row g-3 mb-3" id="summaryRow">
        <div class="col-md-4">
          <div class="kpi-card">
            <div class="kpi-icon bg-success bg-opacity-10 text-success"><i class="bi bi-cash-stack"></i></div>
            <div><div class="kpi-value" id="totalRev">₹0</div><div class="kpi-label">Total Revenue</div></div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="kpi-card">
            <div class="kpi-icon bg-danger bg-opacity-10 text-danger"><i class="bi bi-arrow-counterclockwise"></i></div>
            <div><div class="kpi-value" id="totalRefunded">₹0</div><div class="kpi-label">Refunded</div></div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="kpi-card">
            <div class="kpi-icon bg-primary bg-opacity-10 text-primary"><i class="bi bi-receipt"></i></div>
            <div><div class="kpi-value" id="txCount">0</div><div class="kpi-label">Transactions</div></div>
          </div>
        </div>
      </div>

      <div class="cc-card">
        <div class="table-responsive">
          <table class="table table-hover mb-0" id="payTable">
            <thead><tr>
              <th>Code</th><th>Source</th><th>Method</th>
              <th>Payer</th><th class="text-end">Amount</th><th>Status</th>
              <th>Paid At</th><th>Action</th>
            </tr></thead>
            <tbody><tr><td colspan="8" class="text-center py-4 text-muted">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="alert-bar"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script>
async function loadPayments() {
  const from   = document.getElementById('fromDate').value;
  const to     = document.getElementById('toDate').value;
  const source = document.getElementById('sourceFilter').value;
  const method = document.getElementById('methodFilter').value;
  const status = document.getElementById('statusFilter').value;
  let url = '/api/payments?';
  if (from)   url += 'from='   + from   + '&';
  if (to)     url += 'to='     + to     + '&';
  if (source) url += 'source=' + source + '&';
  if (method) url += 'method=' + method + '&';
  if (status) url += 'status=' + status;

  const rows  = await api.get(url).catch(() => []);
  const tbody = document.querySelector('#payTable tbody');

  // Compute summary
  let rev = 0, refunded = 0;
  rows.forEach(r => {
    if (r.status === 'paid')     rev      += Number(r.amount);
    if (r.status === 'refunded') refunded += Number(r.amount);
  });
  document.getElementById('totalRev').textContent      = fmtINR(rev);
  document.getElementById('totalRefunded').textContent = fmtINR(refunded);
  document.getElementById('txCount').textContent       = rows.length;

  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted">No payments found</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(p => `
    <tr>
      <td><code class="small">${escHtml(p.payment_code)}</code></td>
      <td><span class="badge bg-secondary text-capitalize">${escHtml(p.source)}</span></td>
      <td>${escHtml(p.method)}</td>
      <td>${escHtml(p.payer_name || 'Guest')}</td>
      <td class="text-end">${fmtINR(p.amount)}</td>
      <td>${statusBadge(p.status)}</td>
      <td class="small">${fmtDate(p.paid_at)}</td>
      <td>${p.status === 'paid'
        ? `<button class="btn btn-sm btn-outline-warning btn-refund" data-id="${p.id}">Refund</button>`
        : ''}</td>
    </tr>`).join('');

  document.querySelectorAll('.btn-refund').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Mark this payment as refunded?')) return;
      try {
        await api.post(`/api/payments/refund/${btn.dataset.id}`);
        showAlert('Payment refunded');
        loadPayments();
      } catch(e) { showAlert(e.message, 'danger'); }
    });
  });
}

(async () => {
  const user = await loadSession();
  if (!user) return;
  document.getElementById('userNameSidebar').textContent = user.full_name;
  // Default: last 30 days
  const today = new Date();
  const from  = new Date(today); from.setDate(today.getDate() - 29);
  document.getElementById('fromDate').value = from.toISOString().slice(0,10);
  document.getElementById('toDate').value   = today.toISOString().slice(0,10);
  await loadPayments();
  document.getElementById('filterBtn').addEventListener('click', loadPayments);
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await api.post('/api/auth/logout');
    window.location.href = '/shared/login.html';
  });
})();
</script>
</body>
</html>
