<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payments &amp; Ledger – The Champions Club</title>
  <meta name="description" content="View financial transactions, process refunds, and export payments ledger.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="app-layout">
    <div id="app-shell"></div>

    <main class="app-main">
      <div class="table-card">
        <div class="table-card-header">
          <div>
            <h5 class="table-card-title"><i class="bi bi-credit-card"></i> Central Payments Ledger</h5>
            <p class="table-card-subtitle">All club revenue across Memberships, Court Bookings, Shop POS &amp; Cafeteria</p>
          </div>
          <button class="btn btn-outline-custom text-white border-light border-opacity-50 btn-sm" id="exportCsvBtn">
            <i class="bi bi-download me-1"></i> Export Ledger CSV
          </button>
        </div>

        <div class="table-card-toolbar">
          <div class="search-input-group">
            <i class="bi bi-search search-leading-icon"></i>
            <input type="text" id="searchInput" placeholder="Search payment code, payer name, notes..." aria-label="Search payments">
            <button type="button" class="search-clear-btn d-none" id="searchClearBtn"><i class="bi bi-x"></i></button>
          </div>

          <div class="d-flex align-items-center gap-2 flex-wrap">
            <select id="sourceFilter" class="form-select form-select-sm" style="width: auto;">
              <option value="">All Revenue Streams</option>
              <option value="membership">Membership Fees</option>
              <option value="court">Court Bookings</option>
              <option value="shop">Pro Shop</option>
              <option value="bar">Bar &amp; Cafeteria</option>
            </select>
            <select id="methodFilter" class="form-select form-select-sm" style="width: auto;">
              <option value="">All Payment Methods</option>
              <option value="upi">UPI / QR Code</option>
              <option value="card">Credit/Debit Card</option>
              <option value="cash">Cash</option>
              <option value="online">Online</option>
            </select>
            <select id="statusFilter" class="form-select form-select-sm" style="width: auto;">
              <option value="">All Statuses</option>
              <option value="paid">Paid</option>
              <option value="refunded">Refunded</option>
            </select>
          </div>
        </div>

        <div class="table-responsive">
          <table class="cc-table" id="paymentsTable">
            <thead>
              <tr>
                <th>Payment Code</th>
                <th>Revenue Stream</th>
                <th>Payer / Customer</th>
                <th>Amount (INR)</th>
                <th>Method</th>
                <th>Status</th>
                <th>Date &amp; Time</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="8" class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Loading payments…</td></tr>
            </tbody>
          </table>
        </div>

        <div class="table-footer" id="pagination"></div>
      </div>
    </main>
  </div>

  <!-- ── Refund Modal ──────────────────────────────────────────────────────── -->
  <div class="modal fade" id="refundModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title d-flex align-items-center gap-2">
            <i class="bi bi-arrow-counterclockwise text-danger"></i> Process Transaction Refund
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="ref_payId">
          <p class="fw-bold mb-3 text-dark" id="ref_summary"></p>
          <div class="mb-3">
            <label class="form-label" for="ref_amount">Refund Amount (₹) *</label>
            <input type="number" id="ref_amount" class="form-control" min="0.01" step="0.01" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="ref_reason">Reason for Refund *</label>
            <textarea id="ref_reason" class="form-control" rows="2" placeholder="e.g. Booking cancellation per club policy" required></textarea>
          </div>
          <div id="refundErr" class="alert alert-danger d-none small py-2"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-custom" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="refundSaveBtn">
            <span id="refundSpinner" class="spinner-border spinner-border-sm d-none me-1"></span>
            Process Refund
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/shell.js"></script>
  <script>
    let searchAbort = null;

    async function loadPayments(page = 1) {
      const q = document.getElementById('searchInput').value.trim();
      const source = document.getElementById('sourceFilter').value;
      const method = document.getElementById('methodFilter').value;
      const status = document.getElementById('statusFilter').value;

      if (searchAbort) searchAbort.abort();
      searchAbort = new AbortController();

      const tbody = document.querySelector('#paymentsTable tbody');
      tbody.innerHTML = ui.skeleton(5, 8);

      try {
        const res = await api.get('/api/payments', { q, source, method, status, page, limit: 15 }, { signal: searchAbort.signal });
        const payments = res.data || [];
        const meta = res.meta || { page, total: 0, totalPages: 1, limit: 15 };

        if (!payments.length) {
          tbody.innerHTML = `<tr><td colspan="8">${ui.emptyState({ headline: 'No payments found', message: 'No financial records match your search filters.' })}</td></tr>`;
          document.getElementById('pagination').innerHTML = '';
          return;
        }

        tbody.innerHTML = payments.map(p => {
          const isRefund = Number(p.amount) < 0 || p.status === 'refunded';
          return `
            <tr>
              <td>
                <span class="mono fw-bold text-dark">${utils.escapeHtml(p.payment_code)}</span>
                ${p.refund_of_id ? `<span class="badge bg-secondary ms-1">Refund</span>` : ''}
              </td>
              <td>
                <span class="badge bg-light text-dark text-uppercase">${utils.escapeHtml(p.source)}</span>
              </td>
              <td>
                <div><strong>${utils.escapeHtml(p.payer_name || 'Guest')}</strong></div>
                <div class="small text-muted">${utils.escapeHtml(p.payer_email || '—')}</div>
              </td>
              <td class="mono fw-bold ${isRefund ? 'text-danger' : 'text-success'}">
                ${utils.formatINR(p.amount)}
              </td>
              <td>
                <span class="badge bg-light text-muted text-uppercase">${utils.escapeHtml(p.method)}</span>
              </td>
              <td>${utils.statusChip(p.status)}</td>
              <td class="mono small text-muted">${utils.formatDateTime(p.paid_at)}</td>
              <td class="text-end">
                <div class="d-flex justify-content-end gap-1">
                  ${!isRefund && Number(p.amount) > 0 ? `
                    <button class="btn btn-sm btn-outline-warning" onclick="openRefundModal(${p.id}, '${utils.escapeHtml(p.payment_code)}', ${p.amount})" title="Refund Transaction">
                      <i class="bi bi-arrow-counterclockwise"></i> Refund
                    </button>
                  ` : ''}
                  <button class="btn btn-sm btn-outline-danger" onclick="deletePayment(${p.id}, '${utils.escapeHtml(p.payment_code)}')" title="Delete Payment Record">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
          `;
        }).join('');

        document.getElementById('pagination').innerHTML = ui.renderPagination({
          page: meta.page,
          totalPages: meta.totalPages,
          total: meta.total,
          limit: meta.limit,
          onPageChange: 'loadPayments'
        });
      } catch (err) {
        if (err.name !== 'AbortError') {
          tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-danger">${utils.escapeHtml(err.message)}</td></tr>`;
        }
      }
    }

    async function deletePayment(id, code) {
      const confirmed = await ui.confirmDialog({
        title: 'Delete Payment Record',
        message: `Are you sure you want to delete payment record ${code}?`,
        confirmText: 'Delete Payment',
        danger: true
      });
      if (!confirmed) return;

      try {
        await api.delete(`/api/payments/${id}`);
        ui.toast(`Payment ${code} deleted successfully.`, 'success');
        loadPayments(1);
      } catch (err) {
        ui.toast(err.message, 'error');
      }
    }

    function openRefundModal(id, code, maxAmount) {
      document.getElementById('ref_payId').value = id;
      document.getElementById('ref_summary').textContent = `Transaction: ${code} (Original Amount: ${utils.formatINR(maxAmount)})`;
      document.getElementById('ref_amount').value = maxAmount;
      document.getElementById('ref_amount').setAttribute('max', maxAmount);
      document.getElementById('ref_reason').value = '';
      document.getElementById('refundErr').classList.add('d-none');
      ui.openModal('refundModal');
    }

    document.getElementById('refundSaveBtn').addEventListener('click', async () => {
      const id = document.getElementById('ref_payId').value;
      const amount = document.getElementById('ref_amount').value;
      const reason = document.getElementById('ref_reason').value.trim();
      const errBox = document.getElementById('refundErr');
      const btn = document.getElementById('refundSaveBtn');
      const sp = document.getElementById('refundSpinner');

      if (!amount || parseFloat(amount) <= 0) {
        errBox.textContent = 'Please enter a valid refund amount.';
        errBox.classList.remove('d-none');
        return;
      }
      if (!reason) {
        errBox.textContent = 'Please provide a refund reason.';
        errBox.classList.remove('d-none');
        return;
      }

      errBox.classList.add('d-none');
      btn.disabled = true;
      sp.classList.remove('d-none');

      try {
        await api.post(`/api/payments/${id}/refund`, {
          amount: parseFloat(amount),
          reason
        });
        ui.closeModal('refundModal');
        ui.toast('Refund processed and ledger updated successfully!', 'success');
        loadPayments(1);
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        sp.classList.add('d-none');
      }
    });

    document.getElementById('exportCsvBtn').addEventListener('click', () => {
      window.location.href = '/api/payments/export/csv';
    });

    utils.attachSearch({
      input: 'searchInput',
      clearBtn: 'searchClearBtn',
      onSearch: () => loadPayments(1),
      delay: 300
    });

    document.getElementById('sourceFilter').addEventListener('change', () => loadPayments(1));
    document.getElementById('methodFilter').addEventListener('change', () => loadPayments(1));
    document.getElementById('statusFilter').addEventListener('change', () => loadPayments(1));

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const initialQ = urlParams.get('q');
      if (initialQ) {
        document.getElementById('searchInput').value = initialQ;
        document.getElementById('searchClearBtn')?.classList.remove('d-none');
      }
      loadPayments(1);
    });
  </script>
</body>
</html>
