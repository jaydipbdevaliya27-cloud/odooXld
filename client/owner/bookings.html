<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Court Bookings – The Champions Club</title>
  <meta name="description" content="View court reservations, daily slot schedule matrix, maintenance blocks, and cancellation controls.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="app-layout">
    <div id="app-shell"></div>

    <main class="app-main">
      <!-- Bookings Table Card -->
      <div class="table-card">
        <div class="table-card-header">
          <div>
            <h5 class="table-card-title"><i class="bi bi-calendar-check"></i> Court Bookings &amp; Schedules</h5>
            <p class="table-card-subtitle">Real-time session reservations, participants, and court occupancy</p>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-custom text-white border-light border-opacity-50 btn-sm" data-bs-toggle="modal" data-bs-target="#blockCourtModal">
              <i class="bi bi-shield-slash me-1"></i> Block Court Maintenance
            </button>
          </div>
        </div>

        <!-- Toolbar -->
        <div class="table-card-toolbar">
          <div class="search-input-group">
            <i class="bi bi-search search-leading-icon"></i>
            <input type="text" id="searchInput" placeholder="Search by booking code, player name, court..." aria-label="Search bookings">
            <button type="button" class="search-clear-btn d-none" id="searchClearBtn"><i class="bi bi-x"></i></button>
          </div>

          <div class="d-flex align-items-center gap-2 flex-wrap">
            <input type="date" id="dateFilter" class="form-control form-control-sm" style="width: auto;">
            <select id="statusFilter" class="form-select form-select-sm" style="width: auto;">
              <option value="">All Statuses</option>
              <option value="confirmed">Confirmed</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
            <select id="sportFilter" class="form-select form-select-sm" style="width: auto;">
              <option value="">All Sports</option>
              <option value="tennis">Tennis</option>
              <option value="cricket">Cricket</option>
              <option value="badminton">Badminton</option>
              <option value="pickleball">Pickleball</option>
            </select>
          </div>
        </div>

        <!-- Table -->
        <div class="table-responsive">
          <table class="cc-table" id="bookingsTable">
            <thead>
              <tr>
                <th>Booking Code</th>
                <th>Player / Booker</th>
                <th>Court &amp; Sport</th>
                <th>Date &amp; Time</th>
                <th>Fee Charged</th>
                <th>Source</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="8" class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Loading bookings…</td></tr>
            </tbody>
          </table>
        </div>

        <div class="table-footer" id="pagination"></div>
      </div>
    </main>
  </div>

  <!-- ── Block Court Modal ────────────────────────────────────────────────── -->
  <div class="modal fade" id="blockCourtModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title d-flex align-items-center gap-2">
            <i class="bi bi-shield-slash text-danger"></i> Block Court for Maintenance
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="blockCourtForm" novalidate>
            <div class="mb-3">
              <label class="form-label" for="blk_court">Court *</label>
              <select id="blk_court" name="court_id" class="form-select" required></select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="blk_date">Maintenance Date *</label>
              <input type="date" id="blk_date" name="block_date" class="form-control" required>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label" for="blk_start">Start Time *</label>
                <input type="time" id="blk_start" name="start_time" class="form-control" step="1800" required>
              </div>
              <div class="col-6">
                <label class="form-label" for="blk_end">End Time *</label>
                <input type="time" id="blk_end" name="end_time" class="form-control" step="1800" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="blk_reason">Maintenance Reason *</label>
              <textarea id="blk_reason" name="reason" class="form-control" rows="2" placeholder="e.g. Surface recoating and net repair" required></textarea>
            </div>
            <div id="blockErr" class="alert alert-danger d-none small py-2"></div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-custom" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="blockSaveBtn">
            <span id="blockSpinner" class="spinner-border spinner-border-sm d-none me-1"></span>
            Establish Maintenance Block
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/validators.js"></script>
  <script src="/js/shell.js"></script>
  <script>
    let searchAbort = null;
    let courts = [];

    async function loadCourts() {
      try {
        courts = await api.get('/api/courts');
        const sel = document.getElementById('blk_court');
        sel.innerHTML = courts.map(c => `<option value="${c.id}">${utils.escapeHtml(c.name)} (${c.sport.toUpperCase()})</option>`).join('');
      } catch (e) {}
    }

    async function loadBookings(page = 1) {
      const q = document.getElementById('searchInput').value.trim();
      const date = document.getElementById('dateFilter').value;
      const status = document.getElementById('statusFilter').value;
      const sport = document.getElementById('sportFilter').value;

      if (searchAbort) searchAbort.abort();
      searchAbort = new AbortController();

      const tbody = document.querySelector('#bookingsTable tbody');
      tbody.innerHTML = ui.skeleton(5, 8);

      try {
        const res = await api.get('/api/bookings', { q, date, status, sport, page, limit: 15 }, { signal: searchAbort.signal });
        const bookings = res.data || [];
        const meta = res.meta || { page, total: 0, totalPages: 1, limit: 15 };

        if (!bookings.length) {
          tbody.innerHTML = `<tr><td colspan="8">${ui.emptyState({ headline: 'No bookings found', message: 'No court sessions match the selected filters.' })}</td></tr>`;
          document.getElementById('pagination').innerHTML = '';
          return;
        }

        tbody.innerHTML = bookings.map(b => {
          const isCompleted = b.status === 'completed';
          const isCancelled = b.status === 'cancelled';
          const canCancel = !isCompleted && !isCancelled;

          return `
            <tr>
              <td>
                <span class="mono fw-bold text-dark">${utils.escapeHtml(b.booking_code)}</span>
              </td>
              <td>
                <div>
                  <strong class="text-dark">${utils.escapeHtml(b.player_name)}</strong>
                  ${b.member_code ? `<span class="badge bg-light text-dark ms-1">${utils.escapeHtml(b.member_code)}</span>` : '<span class="badge bg-secondary ms-1">Guest</span>'}
                </div>
                <div class="small text-muted">${utils.escapeHtml(b.player_phone || '—')}</div>
              </td>
              <td>
                <div class="fw-semibold">${utils.escapeHtml(b.court_name)}</div>
                <span class="badge bg-light text-dark text-capitalize">${utils.escapeHtml(b.sport)}</span>
              </td>
              <td>
                <div class="mono fw-semibold">${utils.formatDate(b.booking_date)}</div>
                <div class="small text-muted mono">${utils.formatTime(b.start_time)} – ${utils.formatTime(b.end_time)}</div>
              </td>
              <td>
                <div class="mono fw-bold text-dark">${utils.formatINR(b.price_charged)}</div>
                ${b.discount_pct > 0 ? `<div class="small text-success">${b.discount_pct}% plan disc.</div>` : ''}
              </td>
              <td>
                <span class="small text-muted text-capitalize">${utils.escapeHtml(b.source.replace(/_/g, ' '))}</span>
              </td>
              <td>${utils.statusChip(b.status)}</td>
              <td class="text-end">
                ${canCancel ? `
                  <button class="btn btn-sm btn-outline-danger" onclick="cancelBookingAction(${b.id}, '${utils.escapeHtml(b.booking_code)}')" title="Cancel Booking">
                    <i class="bi bi-calendar-x"></i> Cancel
                  </button>
                ` : `<span class="text-muted small">—</span>`}
              </td>
            </tr>
          `;
        }).join('');

        document.getElementById('pagination').innerHTML = ui.renderPagination({
          page: meta.page,
          totalPages: meta.totalPages,
          total: meta.total,
          limit: meta.limit,
          onPageChange: 'loadBookings'
        });
      } catch (err) {
        if (err.name !== 'AbortError') {
          tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-danger">${utils.escapeHtml(err.message)}</td></tr>`;
        }
      }
    }

    async function cancelBookingAction(id, code) {
      const confirmed = await ui.confirmDialog({
        title: 'Cancel Court Booking',
        message: `Are you sure you want to cancel booking ${code}? The slot will be released and refund logged.`,
        confirmText: 'Cancel Booking',
        danger: true
      });
      if (!confirmed) return;

      try {
        await api.post(`/api/bookings/${id}/cancel`, { cancellation_reason: 'Owner cancelled' });
        ui.toast('Booking cancelled and slot released successfully.', 'success');
        loadBookings(1);
      } catch (err) {
        ui.toast(err.message, 'error');
      }
    }

    // Block court handler
    document.getElementById('blockSaveBtn').addEventListener('click', async () => {
      const form = document.getElementById('blockCourtForm');
      const errBox = document.getElementById('blockErr');
      const btn = document.getElementById('blockSaveBtn');
      const sp = document.getElementById('blockSpinner');

      errBox.classList.add('d-none');
      const courtId = form.court_id.value;

      btn.disabled = true;
      sp.classList.remove('d-none');

      try {
        await api.post(`/api/courts/${courtId}/blocks`, {
          block_date: form.block_date.value,
          start_time: form.start_time.value,
          end_time: form.end_time.value,
          reason: form.reason.value.trim()
        });
        ui.closeModal('blockCourtModal');
        ui.toast('Court maintenance block established successfully.', 'success');
        form.reset();
        loadBookings(1);
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        sp.classList.add('d-none');
      }
    });

    const searchInput = document.getElementById('searchInput');
    const searchClearBtn = document.getElementById('searchClearBtn');

    searchInput.addEventListener('input', utils.debounce((e) => {
      searchClearBtn.classList.toggle('d-none', !e.target.value);
      loadBookings(1);
    }, 300));

    searchClearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchClearBtn.classList.add('d-none');
      loadBookings(1);
    });

    document.getElementById('dateFilter').addEventListener('change', () => loadBookings(1));
    document.getElementById('statusFilter').addEventListener('change', () => loadBookings(1));
    document.getElementById('sportFilter').addEventListener('change', () => loadBookings(1));

    document.addEventListener('DOMContentLoaded', async () => {
      await loadCourts();
      loadBookings(1);
    });
  </script>
</body>
</html>
