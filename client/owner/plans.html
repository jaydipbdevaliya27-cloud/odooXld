<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membership Plans – The Champions Club</title>
  <meta name="description" content="Configure club membership tiers, discounts, junior plans, and entitlement limits.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="app-layout">
    <div id="app-shell"></div>

    <main class="app-main">
      <div class="table-card">
        <div class="table-card-header">
          <div>
            <h5 class="table-card-title"><i class="bi bi-award"></i> Membership Plans &amp; Tiers</h5>
            <p class="table-card-subtitle">Manage annual fees, duration, sports discounts &amp; booking quotas</p>
          </div>
          <button class="btn btn-accent btn-sm" data-bs-toggle="modal" data-bs-target="#planModal" onclick="clearPlanForm()">
            <i class="bi bi-plus-lg me-1"></i> Create Plan Tier
          </button>
        </div>

        <div class="table-responsive">
          <table class="cc-table" id="plansTable">
            <thead>
              <tr>
                <th>Tier / Code</th>
                <th>Plan Name</th>
                <th>Annual Fee</th>
                <th>Duration</th>
                <th>Court Discount</th>
                <th>Shop Discount</th>
                <th>Bar Discount</th>
                <th>Daily Limit</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="10" class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Loading plans…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- ── Add/Edit Plan Modal ────────────────────────────────────────────────── -->
  <div class="modal fade" id="planModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title d-flex align-items-center gap-2" id="planModalTitle">
            <i class="bi bi-award text-accent"></i> Create Membership Plan
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="planForm" novalidate>
            <input type="hidden" id="p_id">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="pl_code">Plan Code *</label>
                <input type="text" id="pl_code" name="code" class="form-control text-uppercase" placeholder="e.g. PLATINUM" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="pl_name">Plan Name *</label>
                <input type="text" id="pl_name" name="name" class="form-control" placeholder="e.g. Platinum All-Access" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="pl_fee">Annual Fee (₹) *</label>
                <input type="number" id="pl_fee" name="annual_fee" class="form-control" min="0" step="100" placeholder="25000" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="pl_dur">Duration (Months) *</label>
                <input type="number" id="pl_dur" name="duration_months" class="form-control" min="1" max="60" value="12" required>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="pl_cd">Court Discount (%)</label>
                <input type="number" id="pl_cd" name="court_discount_pct" class="form-control" min="0" max="100" value="0">
              </div>
              <div class="col-md-4">
                <label class="form-label" for="pl_sd">Shop Discount (%)</label>
                <input type="number" id="pl_sd" name="shop_discount_pct" class="form-control" min="0" max="100" value="0">
              </div>
              <div class="col-md-4">
                <label class="form-label" for="pl_bd">Bar Discount (%)</label>
                <input type="number" id="pl_bd" name="bar_discount_pct" class="form-control" min="0" max="100" value="0">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="pl_maxb">Max Bookings Per Day</label>
                <input type="number" id="pl_maxb" name="max_bookings_per_day" class="form-control" min="1" max="10" value="2">
              </div>
              <div class="col-md-6 d-flex align-items-center pt-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="pl_junior">
                  <label class="form-check-label fw-semibold" for="pl_junior">Junior Plan (Under 18 with guardian)</label>
                </div>
              </div>
              <div class="col-12">
                <label class="form-label" for="pl_desc">Description &amp; Privileges</label>
                <textarea id="pl_desc" name="description" class="form-control" rows="2" placeholder="Describe inclusions, court access, and member perks..."></textarea>
              </div>
            </div>
            <div id="planErr" class="alert alert-danger d-none small py-2 mt-3"></div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-custom" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-accent" id="planSaveBtn">
            <span id="planSpinner" class="spinner-border spinner-border-sm d-none me-1"></span>
            Save Plan Tier
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/validators.js"></script>
  <script src="/js/shell.js"></script>
  <script>
    async function loadPlans() {
      const tbody = document.querySelector('#plansTable tbody');
      try {
        const plans = await api.get('/api/plans?all=1');
        tbody.innerHTML = plans.map(p => `
          <tr>
            <td>
              <code class="fw-bold text-dark fs-6">${utils.escapeHtml(p.code)}</code>
              ${p.is_junior ? '<span class="badge bg-info text-white ms-1">Junior Tier</span>' : ''}
            </td>
            <td>
              <strong class="text-dark">${utils.escapeHtml(p.name)}</strong>
              <div class="small text-muted">${utils.escapeHtml(p.description || '')}</div>
            </td>
            <td class="mono fw-bold">${utils.formatINR(p.annual_fee)}</td>
            <td class="mono small">${p.duration_months} months</td>
            <td><span class="badge bg-success bg-opacity-15 text-success">${p.court_discount_pct}%</span></td>
            <td><span class="badge bg-success bg-opacity-15 text-success">${p.shop_discount_pct}%</span></td>
            <td><span class="badge bg-success bg-opacity-15 text-success">${p.bar_discount_pct}%</span></td>
            <td class="mono">${p.max_bookings_per_day} / day</td>
            <td>${p.is_active ? utils.statusChip('active') : utils.statusChip('suspended')}</td>
            <td class="text-end">
              <button class="icon-btn" onclick="openEditPlanModal(${p.id})" title="Edit Plan">
                <i class="bi bi-pencil"></i>
              </button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="10" class="text-center py-4 text-danger">${utils.escapeHtml(err.message)}</td></tr>`;
      }
    }

    function clearPlanForm() {
      document.getElementById('p_id').value = '';
      document.getElementById('planForm').reset();
      document.getElementById('pl_code').removeAttribute('readonly');
      document.getElementById('planModalTitle').innerHTML = '<i class="bi bi-award text-accent"></i> Create Membership Plan';
      document.getElementById('planErr').classList.add('d-none');
    }

    async function openEditPlanModal(id) {
      try {
        const p = await api.get(`/api/plans/${id}`);
        document.getElementById('p_id').value = p.id;
        document.getElementById('pl_code').value = p.code;
        document.getElementById('pl_code').setAttribute('readonly', 'true');
        document.getElementById('pl_name').value = p.name;
        document.getElementById('pl_fee').value = p.annual_fee;
        document.getElementById('pl_dur').value = p.duration_months;
        document.getElementById('pl_cd').value = p.court_discount_pct;
        document.getElementById('pl_sd').value = p.shop_discount_pct;
        document.getElementById('pl_bd').value = p.bar_discount_pct;
        document.getElementById('pl_maxb').value = p.max_bookings_per_day;
        document.getElementById('pl_junior').checked = !!p.is_junior;
        document.getElementById('pl_desc').value = p.description || '';
        document.getElementById('planModalTitle').innerHTML = '<i class="bi bi-pencil text-accent"></i> Edit Membership Plan';
        document.getElementById('planErr').classList.add('d-none');
        ui.openModal('planModal');
      } catch (err) {
        ui.toast(err.message, 'error');
      }
    }

    document.getElementById('planSaveBtn').addEventListener('click', async () => {
      const id = document.getElementById('p_id').value;
      const form = document.getElementById('planForm');
      const errBox = document.getElementById('planErr');
      const btn = document.getElementById('planSaveBtn');
      const sp = document.getElementById('planSpinner');

      errBox.classList.add('d-none');

      const isValid = validators.validateForm(form, {
        code: { required: true, minLength: 2, label: 'Plan code' },
        name: { required: true, minLength: 2, label: 'Plan name' },
        annual_fee: { required: true, label: 'Annual fee' }
      });
      if (!isValid) return;

      btn.disabled = true;
      sp.classList.remove('d-none');

      try {
        const payload = {
          code: form.code.value.trim().toUpperCase(),
          name: form.name.value.trim(),
          annual_fee: parseFloat(form.annual_fee.value),
          duration_months: parseInt(form.duration_months.value, 10),
          court_discount_pct: parseFloat(form.court_discount_pct.value || 0),
          shop_discount_pct: parseFloat(form.shop_discount_pct.value || 0),
          bar_discount_pct: parseFloat(form.bar_discount_pct.value || 0),
          max_bookings_per_day: parseInt(form.max_bookings_per_day.value || 2, 10),
          is_junior: document.getElementById('pl_junior').checked ? 1 : 0,
          description: form.description.value.trim() || undefined
        };

        if (id) {
          await api.put(`/api/plans/${id}`, payload);
          ui.toast('Plan updated successfully!', 'success');
        } else {
          await api.post('/api/plans', payload);
          ui.toast('Plan created successfully!', 'success');
        }

        ui.closeModal('planModal');
        loadPlans();
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        sp.classList.add('d-none');
      }
    });

    document.addEventListener('DOMContentLoaded', loadPlans);
  </script>
</body>
</html>
