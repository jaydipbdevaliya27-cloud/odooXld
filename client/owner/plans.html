<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membership Plans – The Champions Club</title>
  <meta name="description" content="Configure club membership tiers, discounts, junior plans, and entitlement limits.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="app-layout">
    <div id="app-shell"></div>

    <main class="app-main">
      <div class="table-card">
        <div class="table-card-header">
          <div>
            <h5 class="table-card-title"><i class="bi bi-award"></i> Membership Plans &amp; Tiers</h5>
            <p class="table-card-subtitle">Manage annual fees, duration, sports discounts &amp; booking quotas</p>
          </div>
          <button class="btn btn-accent btn-sm" data-bs-toggle="modal" data-bs-target="#planModal" onclick="clearPlanForm()">
            <i class="bi bi-plus-lg me-1"></i> Create Plan Tier
          </button>
        </div>

        <div class="table-card-toolbar">
          <div class="search-input-group">
            <i class="bi bi-search search-leading-icon"></i>
            <input type="text" id="searchInput" placeholder="Search by plan name, tier, code..." aria-label="Search plans">
            <button type="button" class="search-clear-btn d-none" id="searchClearBtn"><i class="bi bi-x"></i></button>
          </div>
          <select id="statusFilter" class="form-select form-select-sm" style="width: auto;">
            <option value="">All Statuses</option>
            <option value="active">Active Only</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>

        <div class="table-responsive">
          <table class="cc-table" id="plansTable">
            <thead>
              <tr>
                <th>Tier / Code</th>
                <th>Plan Name</th>
                <th>Annual Fee</th>
                <th>Duration</th>
                <th>Court Discount</th>
                <th>Shop Discount</th>
                <th>Bar Discount</th>
                <th>Daily Limit</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="10" class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Loading plans…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- ── Add/Edit Plan Modal ────────────────────────────────────────────────── -->
  <div class="modal fade" id="planModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title d-flex align-items-center gap-2" id="planModalTitle">
            <i class="bi bi-award text-accent"></i> Create Membership Plan
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="planForm" novalidate>
            <input type="hidden" id="p_id">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="pl_code">Plan Code *</label>
                <input type="text" id="pl_code" name="code" class="form-control text-uppercase" placeholder="e.g. PLATINUM" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="pl_name">Plan Name *</label>
                <input type="text" id="pl_name" name="name" class="form-control" placeholder="e.g. Platinum All-Access" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="pl_fee">Annual Fee (₹) *</label>
                <input type="number" id="pl_fee" name="annual_fee" class="form-control" min="0" step="100" placeholder="25000" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="pl_dur">Duration (Months) *</label>
                <input type="number" id="pl_dur" name="duration_months" class="form-control" min="1" max="60" value="12" required>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="pl_cd">Court Discount (%)</label>
                <input type="number" id="pl_cd" name="court_discount_pct" class="form-control" min="0" max="100" value="0">
              </div>
              <div class="col-md-4">
                <label class="form-label" for="pl_sd">Shop Discount (%)</label>
                <input type="number" id="pl_sd" name="shop_discount_pct" class="form-control" min="0" max="100" value="0">
              </div>
              <div class="col-md-4">
                <label class="form-label" for="pl_bd">Bar Discount (%)</label>
                <input type="number" id="pl_bd" name="bar_discount_pct" class="form-control" min="0" max="100" value="0">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="pl_maxb">Max Bookings Per Day</label>
                <input type="number" id="pl_maxb" name="max_bookings_per_day" class="form-control" min="1" max="10" value="2">
              </div>
              <div class="col-md-6 d-flex align-items-center pt-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="pl_junior">
                  <label class="form-check-label fw-semibold" for="pl_junior">Junior Plan (Under 18 with guardian)</label>
                </div>
              </div>
              <div class="col-12">
                <label class="form-label" for="pl_desc">Description &amp; Privileges</label>
                <textarea id="pl_desc" name="description" class="form-control" rows="2" placeholder="Describe inclusions, court access, and member perks..."></textarea>
              </div>
            </div>
            <div id="planErr" class="alert alert-danger d-none small py-2 mt-3"></div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-custom" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-accent" id="planSaveBtn">
            <span id="planSpinner" class="spinner-border spinner-border-sm d-none me-1"></span>
            Save Plan Tier
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── View Plan Modal ──────────────────────────────────────────────────── -->
  <div class="modal fade" id="viewPlanModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title d-flex align-items-center gap-2">
            <i class="bi bi-award text-primary"></i> Membership Plan Details &amp; Privileges
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="viewPlanModalBody">
          <div class="text-center py-5 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Loading plan details…</div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-custom" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/validators.js"></script>
  <script src="/js/shell.js"></script>
  <script>
    let searchAbort = null;
    let ALL_PLANS_CACHE = [];

    async function loadPlans() {
      const q = document.getElementById('searchInput')?.value.trim() || '';
      const status = document.getElementById('statusFilter')?.value || '';
      const tbody = document.querySelector('#plansTable tbody');

      if (searchAbort) searchAbort.abort();
      searchAbort = new AbortController();

      tbody.innerHTML = ui.skeleton(4, 10);

      try {
        const plans = await api.get('/api/plans', { all: 1, q, status }, { signal: searchAbort.signal });
        ALL_PLANS_CACHE = Array.isArray(plans) ? plans : [];

        if (!ALL_PLANS_CACHE.length) {
          tbody.innerHTML = `<tr><td colspan="10">${ui.emptyState({ headline: 'No plans found', message: 'No membership plans match your search filter.' })}</td></tr>`;
          return;
        }

        tbody.innerHTML = ALL_PLANS_CACHE.map(p => `
          <tr>
            <td>
              <code class="fw-bold text-dark fs-6">${utils.escapeHtml(p.code)}</code>
              ${p.is_junior ? '<span class="badge bg-info text-white ms-1">Junior Tier</span>' : ''}
            </td>
            <td>
              <strong class="text-dark">${utils.escapeHtml(p.name)}</strong>
              <div class="small text-muted">${utils.escapeHtml(p.description || '')}</div>
            </td>
            <td class="mono fw-bold">${utils.formatINR(p.annual_fee)}</td>
            <td class="mono small">${p.duration_months} months</td>
            <td><span class="discount-rate discount-court"><i class="bi bi-calendar-check"></i>${p.court_discount_pct}%</span></td>
            <td><span class="discount-rate discount-shop"><i class="bi bi-bag"></i>${p.shop_discount_pct}%</span></td>
            <td><span class="discount-rate discount-bar"><i class="bi bi-cup-hot"></i>${p.bar_discount_pct}%</span></td>
            <td class="mono">${p.max_bookings_per_day} / day</td>
            <td>${p.is_active ? utils.statusChip('active') : utils.statusChip('suspended')}</td>
            <td class="text-end">
              <div class="d-flex justify-content-end gap-1">
                <button class="icon-btn text-primary" onclick="openViewPlanModal(${p.id})" title="View Plan Details">
                  <i class="bi bi-eye"></i>
                </button>
                <button class="icon-btn" onclick="openEditPlanModal(${p.id})" title="Edit Plan">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="icon-btn text-danger" onclick="deletePlan(${p.id}, '${utils.escapeHtml(p.name)}')" title="Delete Plan">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        if (err.name !== 'AbortError') {
          tbody.innerHTML = `<tr><td colspan="10" class="text-center py-4 text-danger">${utils.escapeHtml(err.message)}</td></tr>`;
        }
      }
    }

    async function openViewPlanModal(id) {
      const modalBody = document.getElementById('viewPlanModalBody');
      modalBody.innerHTML = `<div class="text-center py-5 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Loading plan details…</div>`;
      ui.openModal('viewPlanModal');

      try {
        const p = await api.get(`/api/plans/${id}`);

        const sampleMembersHtml = (p.sample_members && p.sample_members.length) ? `
          <div class="table-responsive">
            <table class="table table-sm align-middle small mb-0">
              <thead class="table-light"><tr><th>Member</th><th>Code</th><th>Status</th><th>Expiry Date</th></tr></thead>
              <tbody>
                ${p.sample_members.map(m => `
                  <tr>
                    <td><strong>${utils.escapeHtml(m.full_name)}</strong></td>
                    <td><code>${utils.escapeHtml(m.member_code)}</code></td>
                    <td>${utils.statusChip(m.status)}</td>
                    <td class="mono">${utils.formatDate(m.expiry_date)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        ` : `<p class="text-muted small">No members currently enrolled on this tier.</p>`;

        modalBody.innerHTML = `
          <div class="d-flex align-items-center justify-content-between p-3 bg-light rounded-3 mb-3 border">
            <div>
              <div class="d-flex align-items-center gap-2">
                <code class="fw-bold fs-5 text-dark">${utils.escapeHtml(p.code)}</code>
                <h5 class="mb-0 fw-bold text-dark">${utils.escapeHtml(p.name)}</h5>
                ${p.is_junior ? '<span class="badge bg-info text-white">Junior Tier</span>' : ''}
                ${p.is_active ? utils.statusChip('active') : utils.statusChip('suspended')}
              </div>
              <div class="small text-muted mt-1">${utils.escapeHtml(p.description || 'No description provided')}</div>
            </div>
            <div class="d-flex gap-2">
              <a href="members.html?plan_id=${p.id}" class="btn btn-sm btn-outline-primary"><i class="bi bi-people me-1"></i>View Members</a>
              <button class="btn btn-sm btn-outline-custom" onclick="ui.closeModal('viewPlanModal'); openEditPlanModal(${p.id});"><i class="bi bi-pencil me-1"></i>Edit</button>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <div class="card h-100 border p-3">
                <h6 class="fw-bold text-dark mb-2 border-bottom pb-2"><i class="bi bi-currency-rupee me-1 text-primary"></i> Pricing &amp; Validity</h6>
                <div class="small d-flex flex-column gap-2">
                  <div><strong>Annual / Tier Fee:</strong> <span class="fs-6 fw-bold mono text-dark">${utils.formatINR(p.annual_fee)}</span></div>
                  <div><strong>Validity Duration:</strong> <span class="mono text-dark fw-semibold">${p.duration_months} Months</span></div>
                  <div><strong>Max Bookings / Day:</strong> <span class="mono text-dark fw-semibold">${p.max_bookings_per_day} slot(s)</span></div>
                  <div><strong>Target Audience:</strong> ${p.is_junior ? '<span class="badge bg-warning text-dark">Youth under 18 years</span>' : '<span class="badge bg-light text-dark border">General / Adults</span>'}</div>
                </div>
              </div>
            </div>

            <div class="col-md-6">
              <div class="card h-100 border p-3">
                <h6 class="fw-bold text-dark mb-2 border-bottom pb-2"><i class="bi bi-percent me-1 text-primary"></i> Member Discount Privileges</h6>
                <div class="small d-flex flex-column gap-2">
                  <div class="d-flex justify-content-between align-items-center">
                    <span>Court Booking Discount:</span>
                    <span class="badge bg-success bg-opacity-10 text-success fw-bold">${p.court_discount_pct}% OFF</span>
                  </div>
                  <div class="d-flex justify-content-between align-items-center">
                    <span>Pro Shop Retail Discount:</span>
                    <span class="badge bg-info bg-opacity-10 text-info fw-bold">${p.shop_discount_pct}% OFF</span>
                  </div>
                  <div class="d-flex justify-content-between align-items-center">
                    <span>Cafe &amp; Bar Counter Discount:</span>
                    <span class="badge bg-warning bg-opacity-10 text-dark fw-bold">${p.bar_discount_pct}% OFF</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-sm-6">
              <div class="p-3 border rounded-3 bg-light text-center">
                <div class="text-muted small">Active Enrolled Members</div>
                <div class="fs-4 fw-bold text-success mono">${p.active_members || 0}</div>
              </div>
            </div>
            <div class="col-sm-6">
              <div class="p-3 border rounded-3 bg-light text-center">
                <div class="text-muted small">Total Historical Members</div>
                <div class="fs-4 fw-bold text-dark mono">${p.total_members || 0}</div>
              </div>
            </div>
          </div>

          <div class="card border p-3">
            <h6 class="fw-bold text-dark mb-2 border-bottom pb-2"><i class="bi bi-people me-1 text-primary"></i> Enrolled Members (Sample)</h6>
            ${sampleMembersHtml}
          </div>
        `;
      } catch (err) {
        modalBody.innerHTML = `<div class="alert alert-danger py-3"><i class="bi bi-exclamation-triangle me-2"></i>Failed to load plan details: ${utils.escapeHtml(err.message)}</div>`;
      }
    }

    async function deletePlan(id, name) {
      const confirmed = await ui.confirmDialog({
        title: 'Delete Membership Plan',
        message: `Are you sure you want to delete plan "${name}"?`,
        confirmText: 'Delete Plan',
        danger: true
      });
      if (!confirmed) return;

      try {
        await api.delete(`/api/plans/${id}?force=true`);
        ui.toast(`Plan "${name}" deleted successfully.`, 'success');
        loadPlans();
      } catch (err) {
        ui.toast(err.message, 'error');
      }
    }

    function clearPlanForm() {
      document.getElementById('p_id').value = '';
      document.getElementById('planForm').reset();
      document.getElementById('pl_code').removeAttribute('readonly');
      document.getElementById('planModalTitle').innerHTML = '<i class="bi bi-award text-accent"></i> Create Membership Plan';
      document.getElementById('planErr').classList.add('d-none');
    }

    async function openEditPlanModal(id) {
      try {
        const p = await api.get(`/api/plans/${id}`);
        document.getElementById('p_id').value = p.id;
        document.getElementById('pl_code').value = p.code;
        document.getElementById('pl_code').setAttribute('readonly', 'true');
        document.getElementById('pl_name').value = p.name;
        document.getElementById('pl_fee').value = p.annual_fee;
        document.getElementById('pl_dur').value = p.duration_months;
        document.getElementById('pl_cd').value = p.court_discount_pct;
        document.getElementById('pl_sd').value = p.shop_discount_pct;
        document.getElementById('pl_bd').value = p.bar_discount_pct;
        document.getElementById('pl_maxb').value = p.max_bookings_per_day;
        document.getElementById('pl_junior').checked = !!p.is_junior;
        document.getElementById('pl_desc').value = p.description || '';
        document.getElementById('planModalTitle').innerHTML = '<i class="bi bi-pencil text-accent"></i> Edit Membership Plan';
        document.getElementById('planErr').classList.add('d-none');
        ui.openModal('planModal');
      } catch (err) {
        ui.toast(err.message, 'error');
      }
    }

    document.getElementById('planSaveBtn').addEventListener('click', async () => {
      const id = document.getElementById('p_id').value;
      const form = document.getElementById('planForm');
      const errBox = document.getElementById('planErr');
      const btn = document.getElementById('planSaveBtn');
      const sp = document.getElementById('planSpinner');

      errBox.classList.add('d-none');

      const isValid = validators.validateForm(form, {
        code: { required: true, minLength: 2, label: 'Plan code' },
        name: { required: true, minLength: 2, label: 'Plan name' },
        annual_fee: { required: true, label: 'Annual fee' }
      });
      if (!isValid) return;

      btn.disabled = true;
      sp.classList.remove('d-none');

      try {
        const payload = {
          code: form.code.value.trim().toUpperCase(),
          name: form.name.value.trim(),
          annual_fee: parseFloat(form.annual_fee.value),
          duration_months: parseInt(form.duration_months.value, 10),
          court_discount_pct: parseFloat(form.court_discount_pct.value || 0),
          shop_discount_pct: parseFloat(form.shop_discount_pct.value || 0),
          bar_discount_pct: parseFloat(form.bar_discount_pct.value || 0),
          max_bookings_per_day: parseInt(form.max_bookings_per_day.value || 2, 10),
          is_junior: document.getElementById('pl_junior').checked ? 1 : 0,
          description: form.description.value.trim() || undefined
        };

        if (id) {
          await api.put(`/api/plans/${id}`, payload);
          ui.toast('Plan updated successfully!', 'success');
        } else {
          await api.post('/api/plans', payload);
          ui.toast('Plan created successfully!', 'success');
        }

        ui.closeModal('planModal');
        loadPlans();
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        sp.classList.add('d-none');
      }
    });

    utils.attachSearch({
      input: 'searchInput',
      clearBtn: 'searchClearBtn',
      onSearch: () => loadPlans(),
      delay: 300
    });

    document.getElementById('statusFilter')?.addEventListener('change', () => loadPlans());

    document.addEventListener('DOMContentLoaded', loadPlans);
  </script>
</body>
</html>
