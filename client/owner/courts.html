<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courts &amp; Arenas – The Champions Club</title>
  <meta name="description" content="Manage court inventory, hourly pricing, surfaces, and sports facilities.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="app-layout">
    <div id="app-shell"></div>

    <main class="app-main">
      <div class="table-card">
        <div class="table-card-header">
          <div>
            <h5 class="table-card-title"><i class="bi bi-geo-alt"></i> Courts &amp; Sports Arenas</h5>
            <p class="table-card-subtitle">Manage facility surfaces, standard hourly rates, and active states</p>
          </div>
          <button class="btn btn-accent btn-sm" data-bs-toggle="modal" data-bs-target="#courtModal" onclick="clearCourtForm()">
            <i class="bi bi-plus-lg me-1"></i> Add New Court
          </button>
        </div>

        <div class="table-card-toolbar">
          <div class="search-input-group">
            <i class="bi bi-search search-leading-icon"></i>
            <input type="text" id="searchInput" placeholder="Search court name, surface, sport..." aria-label="Search courts">
            <button type="button" class="search-clear-btn d-none" id="searchClearBtn"><i class="bi bi-x"></i></button>
          </div>
          <select id="sportFilter" class="form-select form-select-sm" style="width: auto;">
            <option value="">All Sports</option>
            <option value="tennis">Tennis</option>
            <option value="cricket">Cricket</option>
            <option value="badminton">Badminton</option>
            <option value="pickleball">Pickleball</option>
          </select>
        </div>

        <div class="table-responsive">
          <table class="cc-table" id="courtsTable">
            <thead>
              <tr>
                <th>Court Name</th>
                <th>Sport</th>
                <th>Surface Specification</th>
                <th>Hourly Base Rate</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="6" class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Loading courts…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- ── Add/Edit Court Modal ──────────────────────────────────────────────── -->
  <div class="modal fade" id="courtModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title d-flex align-items-center gap-2" id="courtModalTitle">
            <i class="bi bi-geo-alt text-accent"></i> Add New Court
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="courtForm" novalidate>
            <input type="hidden" id="c_id">
            <div class="mb-3">
              <label class="form-label" for="c_name">Court / Arena Name *</label>
              <input type="text" id="c_name" name="name" class="form-control" placeholder="e.g. Court 5 - Pickleball Center" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="c_sport">Sport *</label>
              <select id="c_sport" name="sport" class="form-select" required>
                <option value="tennis">Tennis</option>
                <option value="cricket">Cricket</option>
                <option value="badminton">Badminton</option>
                <option value="pickleball">Pickleball</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="c_surf">Surface Specification</label>
              <input type="text" id="c_surf" name="surface_type" class="form-control" placeholder="e.g. Synthetic Acrylic / Clay / Teak Wood">
            </div>
            <div class="mb-3">
              <label class="form-label" for="c_price">Base Price Per Hour (₹) *</label>
              <input type="number" id="c_price" name="base_price_per_hour" class="form-control" min="0" step="50" placeholder="600" required>
            </div>
            <div class="mb-3" id="activeCheckboxWrap">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="c_active" checked>
                <label class="form-check-label" for="c_active">Active for bookings</label>
              </div>
            </div>
            <div id="courtErr" class="alert alert-danger d-none small py-2"></div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-custom" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-accent" id="courtSaveBtn">
            <span id="courtSpinner" class="spinner-border spinner-border-sm d-none me-1"></span>
            Save Court
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/validators.js"></script>
  <script src="/js/shell.js"></script>
  <script>
    let searchAbort = null;

    async function loadCourts() {
      const q = document.getElementById('searchInput')?.value.trim() || '';
      const sport = document.getElementById('sportFilter')?.value || '';
      const tbody = document.querySelector('#courtsTable tbody');

      if (searchAbort) searchAbort.abort();
      searchAbort = new AbortController();

      tbody.innerHTML = ui.skeleton(4, 6);

      try {
        const courts = await api.get('/api/courts', { q, sport }, { signal: searchAbort.signal });
        if (!courts.length) {
          tbody.innerHTML = `<tr><td colspan="6">${ui.emptyState({ headline: 'No courts found', message: 'No courts match your search filters.' })}</td></tr>`;
          return;
        }

        tbody.innerHTML = courts.map(c => `
          <tr>
            <td>
              <strong class="d-block text-dark">${utils.escapeHtml(c.name)}</strong>
              <span class="small text-muted">ID: ${c.id}</span>
            </td>
            <td><span class="badge bg-light text-dark text-capitalize">${utils.escapeHtml(c.sport)}</span></td>
            <td>${utils.escapeHtml(c.surface_type || 'Standard')}</td>
            <td class="mono fw-bold">${utils.formatINR(c.base_price_per_hour)} / hr</td>
            <td>${c.is_active ? utils.statusChip('active') : utils.statusChip('suspended')}</td>
            <td class="text-end">
              <div class="d-flex justify-content-end gap-1">
                <button class="icon-btn" onclick="openEditCourtModal(${c.id}, '${utils.escapeHtml(c.name)}', '${c.sport}', '${utils.escapeHtml(c.surface_type||'')}', ${c.base_price_per_hour}, ${c.is_active})" title="Edit Court">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="icon-btn text-danger" onclick="deleteCourt(${c.id}, '${utils.escapeHtml(c.name)}')" title="Delete Court">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        if (err.name !== 'AbortError') {
          tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-danger">${utils.escapeHtml(err.message)}</td></tr>`;
        }
      }
    }

    async function deleteCourt(id, name) {
      const confirmed = await ui.confirmDialog({
        title: 'Delete Court',
        message: `Are you sure you want to delete court "${name}"? This action cannot be undone.`,
        confirmText: 'Delete Court',
        danger: true
      });
      if (!confirmed) return;

      try {
        await api.delete(`/api/courts/${id}`);
        ui.toast(`Court "${name}" deleted successfully.`, 'success');
        loadCourts();
      } catch (err) {
        ui.toast(err.message, 'error');
      }
    }

    function clearCourtForm() {
      document.getElementById('c_id').value = '';
      document.getElementById('c_name').value = '';
      document.getElementById('c_surf').value = '';
      document.getElementById('c_price').value = '500';
      document.getElementById('c_active').checked = true;
      document.getElementById('courtModalTitle').innerHTML = '<i class="bi bi-geo-alt text-accent"></i> Add New Court';
      document.getElementById('courtErr').classList.add('d-none');
    }

    function openEditCourtModal(id, name, sport, surface, price, active) {
      document.getElementById('c_id').value = id;
      document.getElementById('c_name').value = name;
      document.getElementById('c_sport').value = sport;
      document.getElementById('c_surf').value = surface;
      document.getElementById('c_price').value = price;
      document.getElementById('c_active').checked = !!active;
      document.getElementById('courtModalTitle').innerHTML = '<i class="bi bi-pencil text-accent"></i> Edit Court Details';
      document.getElementById('courtErr').classList.add('d-none');
      ui.openModal('courtModal');
    }

    document.getElementById('courtSaveBtn').addEventListener('click', async () => {
      const id = document.getElementById('c_id').value;
      const form = document.getElementById('courtForm');
      const errBox = document.getElementById('courtErr');
      const btn = document.getElementById('courtSaveBtn');
      const sp = document.getElementById('courtSpinner');

      errBox.classList.add('d-none');

      const isValid = validators.validateForm(form, {
        name: { required: true, minLength: 2, label: 'Court name' },
        base_price_per_hour: { required: true, label: 'Hourly price' }
      });
      if (!isValid) return;

      btn.disabled = true;
      sp.classList.remove('d-none');

      try {
        const payload = {
          name: form.name.value.trim(),
          sport: form.sport.value,
          surface_type: form.surface_type.value.trim() || undefined,
          base_price_per_hour: parseFloat(form.base_price_per_hour.value),
          is_active: document.getElementById('c_active').checked ? 1 : 0
        };

        if (id) {
          await api.put(`/api/courts/${id}`, payload);
          ui.toast('Court details updated successfully!', 'success');
        } else {
          await api.post('/api/courts', payload);
          ui.toast('Court added successfully!', 'success');
        }

        ui.closeModal('courtModal');
        loadCourts();
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        sp.classList.add('d-none');
      }
    });

    utils.attachSearch({
      input: 'searchInput',
      clearBtn: 'searchClearBtn',
      onSearch: () => loadCourts(),
      delay: 300
    });

    document.getElementById('sportFilter')?.addEventListener('change', () => loadCourts());

    document.addEventListener('DOMContentLoaded', loadCourts);
  </script>
</body>
</html>
