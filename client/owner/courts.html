<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courts – Champions Club</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="cc-wrapper">
  <nav class="cc-sidebar d-flex flex-column">
    <div class="brand"><i class="bi bi-trophy-fill me-2 text-warning"></i>Champions Club</div>
    <ul class="nav flex-column mt-2 flex-grow-1">
      <li><a href="/owner/dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i>Dashboard</a></li>
      <li><a href="/owner/staff.html"     class="nav-link"><i class="bi bi-person-badge"></i>Staff Management</a></li>
      <li><a href="/owner/members.html"   class="nav-link"><i class="bi bi-people"></i>Members</a></li>
      <li><a href="/owner/bookings.html"  class="nav-link"><i class="bi bi-calendar-check"></i>Bookings</a></li>
      <li><a href="/owner/orders.html"    class="nav-link"><i class="bi bi-bag"></i>Orders</a></li>
      <li><a href="/owner/products.html"  class="nav-link"><i class="bi bi-box-seam"></i>Products</a></li>
      <li><a href="/owner/payments.html"  class="nav-link"><i class="bi bi-credit-card"></i>Payments</a></li>
      <li><a href="/owner/plans.html"     class="nav-link"><i class="bi bi-stars"></i>Plans</a></li>
      <li><a href="/owner/courts.html"    class="nav-link active"><i class="bi bi-geo-alt"></i>Courts</a></li>
    </ul>
    <div class="p-3 border-top border-secondary border-opacity-25">
      <div class="d-flex align-items-center gap-2 mb-2 p-2 rounded" style="background:rgba(255,255,255,0.08);">
        <div class="rounded-circle bg-warning text-dark fw-bold d-flex align-items-center justify-content-center" style="width:32px; height:32px; font-size:0.85rem;" id="userInitial">
          O
        </div>
        <div class="overflow-hidden">
          <span id="userNameSidebar" class="fw-semibold text-white d-block text-truncate small" style="max-width:140px;">Club Owner</span>
          <span id="userRoleBadge" class="badge bg-warning text-dark py-0 px-1" style="font-size:0.68rem;">Club Owner</span>
        </div>
      </div>
      <button id="logoutBtn" class="btn btn-sm btn-outline-light w-100"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
    </div>
  </nav>

  <div class="d-flex flex-column flex-grow-1">
    <div class="cc-topbar">
      <h5 class="page-title"><i class="bi bi-geo-alt me-2 text-cc"></i>Courts</h5>
      <button class="btn btn-cc btn-sm" id="addCourtBtn" data-bs-toggle="modal" data-bs-target="#courtModal">
        <i class="bi bi-plus-circle-fill me-1"></i>Add Court
      </button>
    </div>

    <main class="cc-main">
      <div class="cc-card">
        <div class="table-responsive">
          <table class="table table-hover mb-0" id="courtTable">
            <thead><tr>
              <th>Name</th><th>Sport</th><th>Surface</th>
              <th class="text-end">Base Price/hr</th><th>Status</th><th>Actions</th>
            </tr></thead>
            <tbody><tr><td colspan="6" class="text-center py-4 text-muted">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Add/Edit Court Modal -->
<div class="modal fade" id="courtModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="courtModalTitle">Add Court</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="c_id">
        <div class="row g-3">
          <div class="col-12"><label class="form-label">Court Name *</label>
            <input type="text" id="c_name" class="form-control" placeholder="Court A – Tennis"></div>
          <div class="col-md-6"><label class="form-label">Sport *</label>
            <select id="c_sport" class="form-select">
              <option value="tennis">Tennis</option>
              <option value="cricket">Cricket</option>
              <option value="badminton">Badminton</option>
              <option value="pickleball">Pickleball</option>
            </select></div>
          <div class="col-md-6"><label class="form-label">Surface Type</label>
            <input type="text" id="c_surface" class="form-control" placeholder="Hard, Clay, Turf…"></div>
          <div class="col-md-6"><label class="form-label">Price per Hour (₹)</label>
            <input type="number" id="c_price" class="form-control" value="500" min="0"></div>
          <div class="col-md-6"><label class="form-label">Active</label>
            <select id="c_active" class="form-select">
              <option value="1">Yes</option><option value="0">No</option>
            </select></div>
        </div>
        <div id="courtErr" class="alert alert-danger mt-3 d-none small py-2"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" id="courtSaveBtn" class="btn btn-cc">Save Court</button>
      </div>
    </div>
  </div>
</div>

<div id="alert-bar"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script>
async function loadCourts() {
  const rows  = await api.get('/api/courts').catch(() => []);
  const tbody = document.querySelector('#courtTable tbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No courts found</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(c => `
    <tr>
      <td>${escHtml(c.name)}</td>
      <td><span class="badge bg-primary text-capitalize">${escHtml(c.sport)}</span></td>
      <td>${escHtml(c.surface_type || '—')}</td>
      <td class="text-end">${fmtINR(c.base_price_per_hour)}</td>
      <td>${c.is_active ? '<span class="badge badge-active">Active</span>' : '<span class="badge badge-expired">Inactive</span>'}</td>
      <td>
        <button class="btn btn-sm btn-outline-primary btn-edit-court" data-c='${JSON.stringify(c)}'>Edit</button>
      </td>
    </tr>`).join('');

  document.querySelectorAll('.btn-edit-court').forEach(btn => {
    btn.addEventListener('click', () => {
      const c = JSON.parse(btn.dataset.c);
      document.getElementById('courtModalTitle').textContent = 'Edit Court';
      document.getElementById('c_id').value      = c.id;
      document.getElementById('c_name').value    = c.name;
      document.getElementById('c_sport').value   = c.sport;
      document.getElementById('c_surface').value = c.surface_type || '';
      document.getElementById('c_price').value   = c.base_price_per_hour;
      document.getElementById('c_active').value  = c.is_active;
      new bootstrap.Modal(document.getElementById('courtModal')).show();
    });
  });
}

document.getElementById('addCourtBtn').addEventListener('click', () => {
  document.getElementById('courtModalTitle').textContent = 'Add Court';
  document.getElementById('c_id').value = '';
  document.getElementById('c_name').value = document.getElementById('c_surface').value = '';
  document.getElementById('c_price').value = '500';
  document.getElementById('c_active').value = '1';
});

document.getElementById('courtSaveBtn').addEventListener('click', async () => {
  const id  = document.getElementById('c_id').value;
  const err = document.getElementById('courtErr');
  const body = {
    name: document.getElementById('c_name').value.trim(),
    sport: document.getElementById('c_sport').value,
    surface_type: document.getElementById('c_surface').value.trim() || undefined,
    base_price_per_hour: parseFloat(document.getElementById('c_price').value),
    is_active: parseInt(document.getElementById('c_active').value)
  };
  err.classList.add('d-none');
  try {
    if (id) { await api.put(`/api/courts/${id}`, body); }
    else    { await api.post('/api/courts', body); }
    bootstrap.Modal.getInstance(document.getElementById('courtModal')).hide();
    showAlert('Court saved!');
    loadCourts();
  } catch(e) { err.textContent=e.message; err.classList.remove('d-none'); }
});

(async () => {
  const user = await loadSession();
  if (!user) return;
  document.getElementById('userNameSidebar').textContent = user.full_name || 'Club Owner';
  if (document.getElementById('userInitial')) document.getElementById('userInitial').textContent = (user.full_name || 'O').charAt(0).toUpperCase();
  loadCourts();
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await api.post('/api/auth/logout');
    window.location.href = '/shared/login.html';
  });
})();
</script>
</body>
</html>
