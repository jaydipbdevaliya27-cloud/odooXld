<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders &amp; Sales Ledger – The Champions Club</title>
  <meta name="description" content="View store POS sales, bar dine-in tabs, online order fulfilment and deliveries.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="app-layout">
    <div id="app-shell"></div>

    <main class="app-main">
      <div class="table-card">
        <div class="table-card-header">
          <div>
            <h5 class="table-card-title"><i class="bi bi-receipt"></i> Store &amp; Cafeteria Orders</h5>
            <p class="table-card-subtitle">Transactions across Shop Counter, Bar Dine-in Tables &amp; Online Deliveries</p>
          </div>
        </div>

        <div class="table-card-toolbar">
          <div class="search-input-group">
            <i class="bi bi-search search-leading-icon"></i>
            <input type="text" id="searchInput" placeholder="Search order code, customer, table..." aria-label="Search orders">
            <button type="button" class="search-clear-btn d-none" id="searchClearBtn"><i class="bi bi-x"></i></button>
          </div>

          <div class="d-flex align-items-center gap-2 flex-wrap">
            <select id="deptFilter" class="form-select form-select-sm" style="width: auto;">
              <option value="">All Departments</option>
              <option value="shop">Pro Shop</option>
              <option value="bar">Bar &amp; Cafe</option>
            </select>
            <select id="channelFilter" class="form-select form-select-sm" style="width: auto;">
              <option value="">All Channels</option>
              <option value="counter">Counter POS</option>
              <option value="table">Table Dine-In</option>
              <option value="online">Online Delivery</option>
            </select>
            <select id="statusFilter" class="form-select form-select-sm" style="width: auto;">
              <option value="">All Statuses</option>
              <option value="open">Open</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
        </div>

        <div class="table-responsive">
          <table class="cc-table" id="ordersTable">
            <thead>
              <tr>
                <th>Order Code</th>
                <th>Department &amp; Channel</th>
                <th>Customer / Member</th>
                <th>Items Total</th>
                <th>Discounts</th>
                <th>Net Total</th>
                <th>Fulfilment</th>
                <th>Date</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="9" class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Loading orders…</td></tr>
            </tbody>
          </table>
        </div>

        <div class="table-footer" id="pagination"></div>
      </div>
    </main>
  </div>

  <!-- ── Order Detail Drawer (Offcanvas) ────────────────────────────────────── -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="orderDrawer" style="width: 480px;">
    <div class="offcanvas-header border-bottom">
      <h5 class="offcanvas-title fw-bold" id="drawerOrderCode">Order Details</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body" id="orderDrawerBody">
      <div class="text-center py-4"><span class="spinner-border spinner-border-sm"></span></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/shell.js"></script>
  <script>
    let searchAbort = null;

    async function loadOrders(page = 1) {
      const q = document.getElementById('searchInput').value.trim();
      const department = document.getElementById('deptFilter').value;
      const channel = document.getElementById('channelFilter').value;
      const status = document.getElementById('statusFilter').value;

      if (searchAbort) searchAbort.abort();
      searchAbort = new AbortController();

      const tbody = document.querySelector('#ordersTable tbody');
      tbody.innerHTML = ui.skeleton(5, 9);

      try {
        const res = await api.get('/api/orders', { q, department, channel, status, page, limit: 15 }, { signal: searchAbort.signal });
        const orders = res.data || [];
        const meta = res.meta || { page, total: 0, totalPages: 1, limit: 15 };

        if (!orders.length) {
          tbody.innerHTML = `<tr><td colspan="9">${ui.emptyState({ headline: 'No orders found', message: 'No transactions match your search filters.' })}</td></tr>`;
          document.getElementById('pagination').innerHTML = '';
          return;
        }

        tbody.innerHTML = orders.map(o => `
          <tr>
            <td>
              <strong class="mono text-dark d-block">${utils.escapeHtml(o.order_code)}</strong>
              ${o.table_no ? `<span class="badge bg-light text-dark">Table ${utils.escapeHtml(o.table_no)}</span>` : ''}
            </td>
            <td>
              <span class="badge ${o.department === 'shop' ? 'bg-success bg-opacity-10 text-success' : 'bg-warning bg-opacity-10 text-dark'} text-uppercase me-1">
                ${o.department}
              </span>
              <span class="small text-muted text-capitalize">${utils.escapeHtml(o.channel)}</span>
            </td>
            <td>
              <div><strong>${utils.escapeHtml(o.customer_name || 'Walk-in Guest')}</strong></div>
              ${o.member_code ? `<code class="small text-muted">${utils.escapeHtml(o.member_code)}</code>` : ''}
            </td>
            <td class="mono small">${utils.formatINR(o.subtotal)}</td>
            <td>${o.discount_amount > 0 ? `<span class="text-success mono small">-${utils.formatINR(o.discount_amount)} (${o.discount_pct}%)</span>` : '<span class="text-muted small">—</span>'}</td>
            <td class="mono fw-bold text-dark">${utils.formatINR(o.total)}</td>
            <td>${utils.statusChip(o.fulfilment_status || o.status)}</td>
            <td class="small text-muted mono">${utils.formatDateTime(o.created_at)}</td>
            <td class="text-end">
              <div class="d-flex justify-content-end gap-1">
                <button class="icon-btn" onclick="openOrderDrawer(${o.id})" title="View Order Details">
                  <i class="bi bi-eye"></i>
                </button>
                <button class="icon-btn text-danger" onclick="deleteOrderAction(${o.id}, '${utils.escapeHtml(o.order_code)}')" title="Delete Order">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        `).join('');

        document.getElementById('pagination').innerHTML = ui.renderPagination({
          page: meta.page,
          totalPages: meta.totalPages,
          total: meta.total,
          limit: meta.limit,
          onPageChange: 'loadOrders'
        });
      } catch (err) {
        if (err.name !== 'AbortError') {
          tbody.innerHTML = `<tr><td colspan="9" class="text-center py-4 text-danger">${utils.escapeHtml(err.message)}</td></tr>`;
        }
      }
    }

    async function deleteOrderAction(id, code) {
      const confirmed = await ui.confirmDialog({
        title: 'Delete Order',
        message: `Are you sure you want to delete order ${code}? Any tracked inventory will be restored.`,
        confirmText: 'Delete Order',
        danger: true
      });
      if (!confirmed) return;

      try {
        await api.delete(`/api/orders/${id}?force=true`);
        ui.toast(`Order ${code} deleted successfully.`, 'success');
        const drawerEl = document.getElementById('orderDrawer');
        const bsDrawer = bootstrap.Offcanvas.getInstance(drawerEl);
        if (bsDrawer) bsDrawer.hide();
        loadOrders(1);
      } catch (err) {
        ui.toast(err.message, 'error');
      }
    }

    async function openOrderDrawer(id) {
      const drawerBody = document.getElementById('orderDrawerBody');
      const drawerCode = document.getElementById('drawerOrderCode');
      drawerBody.innerHTML = '<div class="text-center py-5"><span class="spinner-border text-accent"></span></div>';

      const drawer = new bootstrap.Offcanvas(document.getElementById('orderDrawer'));
      drawer.show();

      try {
        const o = await api.get(`/api/orders/${id}`);
        drawerCode.textContent = o.order_code;

        let itemsHtml = (o.items || []).map(it => `
          <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
            <div>
              <strong class="d-block text-dark">${utils.escapeHtml(it.product_name)}</strong>
              <span class="small text-muted mono">${it.quantity} × ${utils.formatINR(it.unit_price)}</span>
            </div>
            <div class="mono fw-bold text-dark">${utils.formatINR(it.line_total)}</div>
          </div>
        `).join('');

        drawerBody.innerHTML = `
          <div class="mb-3">
            <div class="d-flex justify-content-between text-muted small mb-1">
              <span>Department: <strong class="text-dark text-uppercase">${o.department}</strong></span>
              <span>Channel: <strong class="text-dark text-capitalize">${o.channel}</strong></span>
            </div>
            <div class="d-flex justify-content-between text-muted small">
              <span>Customer: <strong class="text-dark">${utils.escapeHtml(o.customer_name || 'Guest')}</strong></span>
              <span>Status: ${utils.statusChip(o.status)}</span>
            </div>
          </div>

          <div class="card bg-light border-0 p-3 rounded-3 mb-4">
            <h6 class="fw-bold mb-2">Order Line Items</h6>
            ${itemsHtml}
            <div class="d-flex justify-content-between pt-2">
              <span class="text-muted">Subtotal:</span>
              <span class="mono">${utils.formatINR(o.subtotal)}</span>
            </div>
            ${o.discount_amount > 0 ? `
              <div class="d-flex justify-content-between text-success">
                <span>Member Plan Discount (${o.discount_pct}%):</span>
                <span class="mono">-${utils.formatINR(o.discount_amount)}</span>
              </div>
            ` : ''}
            <div class="d-flex justify-content-between pt-2 border-top mt-2 fs-6 fw-bold text-dark">
              <span>Net Total:</span>
              <span class="mono text-accent">${utils.formatINR(o.total)}</span>
            </div>
          </div>

          ${o.channel === 'online' ? `
            <div class="mb-4">
              <label class="form-label small fw-bold">Update Fulfilment Status</label>
              <div class="d-flex gap-2 flex-wrap">
                <button class="btn btn-sm btn-outline-custom" onclick="updateFulfilment(${o.id}, 'packed')">Packed</button>
                <button class="btn btn-sm btn-outline-custom" onclick="updateFulfilment(${o.id}, 'ready_for_pickup')">Ready for Pickup</button>
                <button class="btn btn-sm btn-outline-custom" onclick="updateFulfilment(${o.id}, 'out_for_delivery')">Out for Delivery</button>
                <button class="btn btn-sm btn-accent" onclick="updateFulfilment(${o.id}, 'delivered')">Delivered / Collected</button>
              </div>
            </div>
          ` : ''}

          <div class="border-top pt-3 mt-3 d-flex justify-content-end">
            <button class="btn btn-sm btn-outline-danger" onclick="deleteOrderAction(${o.id}, '${utils.escapeHtml(o.order_code)}')">
              <i class="bi bi-trash me-1"></i> Delete Order
            </button>
          </div>
        `;
      } catch (err) {
        drawerBody.innerHTML = `<div class="alert alert-danger">${utils.escapeHtml(err.message)}</div>`;
      }
    }

    async function updateFulfilment(id, status) {
      try {
        await api.put(`/api/orders/${id}/fulfilment`, { fulfilment_status: status });
        ui.toast(`Order marked as ${status.replace(/_/g, ' ')}.`, 'success');
        openOrderDrawer(id);
        loadOrders(1);
      } catch (err) {
        ui.toast(err.message, 'error');
      }
    }

    utils.attachSearch({
      input: 'searchInput',
      clearBtn: 'searchClearBtn',
      onSearch: () => loadOrders(1),
      delay: 300
    });

    document.getElementById('deptFilter').addEventListener('change', () => loadOrders(1));
    document.getElementById('channelFilter').addEventListener('change', () => loadOrders(1));
    document.getElementById('statusFilter').addEventListener('change', () => loadOrders(1));

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const initialQ = urlParams.get('q');
      if (initialQ) {
        document.getElementById('searchInput').value = initialQ;
        document.getElementById('searchClearBtn')?.classList.remove('d-none');
      }
      loadOrders(1);
    });
  </script>
</body>
</html>
