<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products – Champions Club</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="cc-wrapper">
  <nav class="cc-sidebar d-flex flex-column">
    <div class="brand"><i class="bi bi-trophy-fill me-2 text-warning"></i>Champions Club</div>
    <ul class="nav flex-column mt-2 flex-grow-1">
      <li><a href="/owner/dashboard.html" class="nav-link"><i class="bi bi-speedometer2"></i>Dashboard</a></li>
      <li><a href="/owner/members.html"   class="nav-link"><i class="bi bi-people"></i>Members</a></li>
      <li><a href="/owner/bookings.html"  class="nav-link"><i class="bi bi-calendar-check"></i>Bookings</a></li>
      <li><a href="/owner/orders.html"    class="nav-link"><i class="bi bi-bag"></i>Orders</a></li>
      <li><a href="/owner/products.html"  class="nav-link active"><i class="bi bi-box-seam"></i>Products</a></li>
      <li><a href="/owner/payments.html"  class="nav-link"><i class="bi bi-credit-card"></i>Payments</a></li>
      <li><a href="/owner/leads.html"     class="nav-link"><i class="bi bi-person-plus"></i>Leads</a></li>
      <li><a href="/owner/plans.html"     class="nav-link"><i class="bi bi-stars"></i>Plans</a></li>
      <li><a href="/owner/courts.html"    class="nav-link"><i class="bi bi-geo-alt"></i>Courts</a></li>
    </ul>
    <div class="p-3"><span id="userNameSidebar" class="small text-muted d-block mb-2"></span>
      <button id="logoutBtn" class="btn btn-sm btn-outline-light w-100"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
    </div>
  </nav>

  <div class="d-flex flex-column flex-grow-1">
    <div class="cc-topbar">
      <h5 class="page-title"><i class="bi bi-box-seam me-2 text-cc"></i>Products & Inventory</h5>
      <button class="btn btn-cc btn-sm" data-bs-toggle="modal" data-bs-target="#prodModal" id="addProdBtn">
        <i class="bi bi-plus-circle-fill me-1"></i>Add Product
      </button>
    </div>

    <main class="cc-main">
      <ul class="nav nav-tabs mb-3" id="deptTabs">
        <li class="nav-item"><button class="nav-link active" data-dept="">All</button></li>
        <li class="nav-item"><button class="nav-link" data-dept="shop">Shop</button></li>
        <li class="nav-item"><button class="nav-link" data-dept="bar">Bar</button></li>
      </ul>

      <div class="cc-card">
        <div class="table-responsive">
          <table class="table table-hover mb-0" id="prodTable">
            <thead><tr>
              <th>SKU</th><th>Name</th><th>Category</th><th>Dept</th>
              <th class="text-end">Price</th><th class="text-end">Stock</th><th>Actions</th>
            </tr></thead>
            <tbody><tr><td colspan="7" class="text-center py-4 text-muted">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Add/Edit Product Modal -->
<div class="modal fade" id="prodModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="prodModalTitle">Add Product</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="p_id">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">SKU *</label>
            <input type="text" id="p_sku" class="form-control" required></div>
          <div class="col-md-6"><label class="form-label">Name *</label>
            <input type="text" id="p_name" class="form-control" required></div>
          <div class="col-md-6"><label class="form-label">Department *</label>
            <select id="p_dept" class="form-select">
              <option value="shop">Shop</option><option value="bar">Bar</option>
            </select></div>
          <div class="col-md-6"><label class="form-label">Category *</label>
            <input type="text" id="p_cat" class="form-control" placeholder="Rackets, Drinks…"></div>
          <div class="col-md-6"><label class="form-label">Selling Price (₹) *</label>
            <input type="number" id="p_price" class="form-control" min="0" step="0.01"></div>
          <div class="col-md-6"><label class="form-label">Cost Price (₹)</label>
            <input type="number" id="p_cost" class="form-control" min="0" step="0.01" value="0"></div>
          <div class="col-md-6"><label class="form-label">Stock Qty</label>
            <input type="number" id="p_stock" class="form-control" min="0" value="0"></div>
          <div class="col-md-6"><label class="form-label">Reorder Level</label>
            <input type="number" id="p_reorder" class="form-control" min="0" value="5"></div>
          <div class="col-12"><label class="form-label">Description</label>
            <textarea id="p_desc" class="form-control" rows="2"></textarea></div>
        </div>
        <div id="prodErr" class="alert alert-danger mt-3 d-none small py-2"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" id="prodSaveBtn" class="btn btn-cc">Save Product</button>
      </div>
    </div>
  </div>
</div>

<div id="alert-bar"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script>
let activeDept = '';

async function loadProducts() {
  let url = '/api/products';
  if (activeDept) url += '?dept=' + activeDept;
  const rows  = await api.get(url).catch(() => []);
  const tbody = document.querySelector('#prodTable tbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No products found</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(p => {
    const lowStock = p.track_stock && p.stock_qty <= p.reorder_level;
    return `<tr>
      <td><code>${escHtml(p.sku)}</code></td>
      <td>${escHtml(p.name)}</td>
      <td>${escHtml(p.category)}</td>
      <td><span class="badge bg-secondary">${escHtml(p.department)}</span></td>
      <td class="text-end">${fmtINR(p.price)}</td>
      <td class="text-end ${lowStock ? 'text-danger fw-bold' : ''}">${p.stock_qty}</td>
      <td>
        <button class="btn btn-sm btn-outline-primary me-1 btn-edit" data-p='${JSON.stringify(p)}'>Edit</button>
        <button class="btn btn-sm btn-outline-danger btn-del" data-id="${p.id}">Delete</button>
      </td>
    </tr>`;
  }).join('');

  document.querySelectorAll('.btn-edit').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = JSON.parse(btn.dataset.p);
      document.getElementById('prodModalTitle').textContent = 'Edit Product';
      document.getElementById('p_id').value     = p.id;
      document.getElementById('p_sku').value    = p.sku;
      document.getElementById('p_name').value   = p.name;
      document.getElementById('p_dept').value   = p.department;
      document.getElementById('p_cat').value    = p.category;
      document.getElementById('p_price').value  = p.price;
      document.getElementById('p_cost').value   = p.cost_price;
      document.getElementById('p_stock').value  = p.stock_qty;
      document.getElementById('p_reorder').value= p.reorder_level;
      document.getElementById('p_desc').value   = p.description || '';
      new bootstrap.Modal(document.getElementById('prodModal')).show();
    });
  });
  document.querySelectorAll('.btn-del').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Deactivate this product?')) return;
      try { await api.del(`/api/products/${btn.dataset.id}`); showAlert('Product deactivated'); loadProducts(); }
      catch(e) { showAlert(e.message, 'danger'); }
    });
  });
}

document.getElementById('addProdBtn').addEventListener('click', () => {
  document.getElementById('prodModalTitle').textContent = 'Add Product';
  document.getElementById('p_id').value = '';
  document.getElementById('p_sku').value = document.getElementById('p_name').value =
  document.getElementById('p_cat').value = document.getElementById('p_desc').value = '';
  document.getElementById('p_price').value = document.getElementById('p_cost').value = '';
  document.getElementById('p_stock').value = '0';
  document.getElementById('p_reorder').value = '5';
});

document.getElementById('prodSaveBtn').addEventListener('click', async () => {
  const id  = document.getElementById('p_id').value;
  const err = document.getElementById('prodErr');
  const body = {
    sku: document.getElementById('p_sku').value.trim(),
    name: document.getElementById('p_name').value.trim(),
    department: document.getElementById('p_dept').value,
    category: document.getElementById('p_cat').value.trim(),
    price: parseFloat(document.getElementById('p_price').value),
    cost_price: parseFloat(document.getElementById('p_cost').value) || 0,
    stock_qty: parseInt(document.getElementById('p_stock').value) || 0,
    reorder_level: parseInt(document.getElementById('p_reorder').value) || 5,
    description: document.getElementById('p_desc').value.trim() || undefined,
    is_active: 1
  };
  err.classList.add('d-none');
  try {
    if (id) { await api.put(`/api/products/${id}`, body); }
    else    { await api.post('/api/products', body); }
    bootstrap.Modal.getInstance(document.getElementById('prodModal')).hide();
    showAlert('Product saved!');
    loadProducts();
  } catch(e) { err.textContent = e.message; err.classList.remove('d-none'); }
});

document.querySelectorAll('#deptTabs button').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('#deptTabs button').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    activeDept = tab.dataset.dept;
    loadProducts();
  });
});

(async () => {
  const user = await loadSession();
  if (!user) return;
  document.getElementById('userNameSidebar').textContent = user.full_name;
  loadProducts();
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await api.post('/api/auth/logout');
    window.location.href = '/shared/login.html';
  });
})();
</script>
</body>
</html>
