<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products &amp; Inventory – The Champions Club</title>
  <meta name="description" content="Manage Pro Shop gear, cafeteria food &amp; beverages, inventory stock movements, and racket stringing jobs.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="app-layout">
    <div id="app-shell"></div>

    <main class="app-main">
      <div class="table-card">
        <div class="table-card-header">
          <div>
            <h5 class="table-card-title"><i class="bi bi-box-seam"></i> Products Catalog &amp; Stock</h5>
            <p class="table-card-subtitle">Manage Pro Shop gear, Bar items, stock reorder levels &amp; pricing</p>
          </div>
          <button class="btn btn-accent btn-sm" data-bs-toggle="modal" data-bs-target="#productModal" onclick="clearProductForm()">
            <i class="bi bi-plus-lg me-1"></i> Add New Product
          </button>
        </div>

        <div class="table-card-toolbar">
          <div class="search-input-group">
            <i class="bi bi-search search-leading-icon"></i>
            <input type="text" id="searchInput" placeholder="Search by product name, SKU, category..." aria-label="Search products">
            <button type="button" class="search-clear-btn d-none" id="searchClearBtn"><i class="bi bi-x"></i></button>
          </div>

          <div class="d-flex align-items-center gap-2 flex-wrap">
            <select id="deptFilter" class="form-select form-select-sm" style="width: auto;">
              <option value="">All Departments</option>
              <option value="shop">Pro Shop</option>
              <option value="bar">Bar &amp; Cafe</option>
            </select>
            <select id="stockFilter" class="form-select form-select-sm" style="width: auto;">
              <option value="">All Stock Levels</option>
              <option value="low">Low Stock (&le; Reorder Level)</option>
              <option value="out">Out of Stock</option>
              <option value="ok">Adequate Stock</option>
            </select>
          </div>
        </div>

        <div class="table-responsive">
          <table class="cc-table" id="productsTable">
            <thead>
              <tr>
                <th>Product</th>
                <th>SKU</th>
                <th>Department</th>
                <th>Category</th>
                <th>Selling Price</th>
                <th>Stock Level</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="8" class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Loading inventory…</td></tr>
            </tbody>
          </table>
        </div>

        <div class="table-footer" id="pagination"></div>
      </div>
    </main>
  </div>

  <!-- ── Add/Edit Product Modal ────────────────────────────────────────────── -->
  <div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title d-flex align-items-center gap-2" id="productModalTitle">
            <i class="bi bi-box-seam text-accent"></i> Add New Product
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="productForm" novalidate>
            <input type="hidden" id="p_id">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="p_sku">SKU Code *</label>
                <input type="text" id="p_sku" name="sku" class="form-control text-uppercase" placeholder="e.g. TEN-RAC-01" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="p_name">Product Name *</label>
                <input type="text" id="p_name" name="name" class="form-control" placeholder="e.g. Wilson Pro Staff v14" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="p_dept">Department *</label>
                <select id="p_dept" name="department" class="form-select" required>
                  <option value="shop">Pro Shop</option>
                  <option value="bar">Bar &amp; Cafeteria</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="p_cat">Category *</label>
                <input type="text" id="p_cat" name="category" class="form-control" placeholder="e.g. Rackets / Beverages / Food" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="p_price">Selling Price (₹) *</label>
                <input type="number" id="p_price" name="price" class="form-control" min="0.01" step="1" placeholder="4500" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="p_cost">Cost Price (₹)</label>
                <input type="number" id="p_cost" name="cost_price" class="form-control" min="0" step="1" placeholder="3200">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="p_stock">Initial Stock Quantity</label>
                <input type="number" id="p_stock" name="stock_qty" class="form-control" min="0" value="10">
              </div>
              <div class="col-md-6">
                <label class="form-label" for="p_reorder">Reorder Threshold Level</label>
                <input type="number" id="p_reorder" name="reorder_level" class="form-control" min="0" value="5">
              </div>
              <div class="col-12">
                <label class="form-label" for="p_img">Product Image URL</label>
                <input type="url" id="p_img" name="image_url" class="form-control" placeholder="https://images.unsplash.com/...">
              </div>
              <div class="col-12">
                <label class="form-label" for="p_desc">Description</label>
                <textarea id="p_desc" name="description" class="form-control" rows="2" placeholder="Product specification and details..."></textarea>
              </div>
            </div>
            <div id="productErr" class="alert alert-danger d-none small py-2 mt-3"></div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-custom" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-accent" id="productSaveBtn">
            <span id="productSpinner" class="spinner-border spinner-border-sm d-none me-1"></span>
            Save Product
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Adjust Stock Modal ────────────────────────────────────────────────── -->
  <div class="modal fade" id="stockModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title d-flex align-items-center gap-2">
            <i class="bi bi-boxes text-accent"></i> Inventory Stock Adjustment
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="stk_prodId">
          <p class="fw-bold mb-3 text-dark" id="stk_prodName"></p>
          <div class="mb-3">
            <label class="form-label">Adjustment Type</label>
            <select id="stk_type" class="form-select">
              <option value="restock">Restock / Shipment Received (+)</option>
              <option value="adjustment">Stock Count Adjustment (+/-)</option>
              <option value="return">Customer Return (+)</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Quantity Adjustment (+ or -)</label>
            <input type="number" id="stk_qty" class="form-control" placeholder="e.g. 10 or -2" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Reason / Notes</label>
            <input type="text" id="stk_notes" class="form-control" placeholder="e.g. Supplier PO receipt">
          </div>
          <div id="stockErr" class="alert alert-danger d-none small py-2"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-custom" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-accent" id="stockSaveBtn">
            <span id="stockSpinner" class="spinner-border spinner-border-sm d-none me-1"></span>
            Apply Adjustment
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/validators.js"></script>
  <script src="/js/shell.js"></script>
  <script>
    let searchAbort = null;

    async function loadProducts(page = 1) {
      const q = document.getElementById('searchInput').value.trim();
      const department = document.getElementById('deptFilter').value;
      const stock = document.getElementById('stockFilter').value;

      if (searchAbort) searchAbort.abort();
      searchAbort = new AbortController();

      const tbody = document.querySelector('#productsTable tbody');
      tbody.innerHTML = ui.skeleton(5, 8);

      try {
        const res = await api.get('/api/products', { q, department, stock, page, limit: 15 }, { signal: searchAbort.signal });
        const products = res.data || [];
        const meta = res.meta || { page, total: 0, totalPages: 1, limit: 15 };

        if (!products.length) {
          tbody.innerHTML = `<tr><td colspan="8">${ui.emptyState({ headline: 'No products found', message: 'No inventory items match your search filters.' })}</td></tr>`;
          document.getElementById('pagination').innerHTML = '';
          return;
        }

        tbody.innerHTML = products.map(p => {
          let stockBadge = `<span class="badge bg-success">${p.stock_qty} in stock</span>`;
          if (p.stock_qty === 0) stockBadge = '<span class="badge bg-danger">Out of Stock</span>';
          else if (p.stock_qty <= p.reorder_level) stockBadge = `<span class="badge bg-warning text-dark">${p.stock_qty} low stock</span>`;

          return `
            <tr>
              <td>
                <div class="d-flex align-items-center gap-2">
                  ${p.image_url ? `<img src="${utils.escapeHtml(p.image_url)}" alt="" class="rounded" style="width:36px;height:36px;object-fit:cover;">` : '<div class="bg-light rounded p-2 text-muted"><i class="bi bi-box-seam"></i></div>'}
                  <div>
                    <strong class="d-block text-dark">${utils.escapeHtml(p.name)}</strong>
                    <span class="small text-muted">${utils.escapeHtml(p.description || '')}</span>
                  </div>
                </div>
              </td>
              <td><code class="text-dark fw-bold">${utils.escapeHtml(p.sku)}</code></td>
              <td><span class="badge ${p.department === 'shop' ? 'bg-success bg-opacity-10 text-success' : 'bg-warning bg-opacity-10 text-dark'} text-uppercase">${p.department}</span></td>
              <td>${utils.escapeHtml(p.category)}</td>
              <td class="mono fw-bold text-dark">${utils.formatINR(p.price)}</td>
              <td>${p.track_stock ? stockBadge : '<span class="badge bg-light text-muted">Untracked</span>'}</td>
              <td>${p.is_active ? utils.statusChip('active') : utils.statusChip('suspended')}</td>
              <td class="text-end">
                <div class="d-flex justify-content-end gap-1">
                  <button class="icon-btn" onclick="openStockModal(${p.id}, '${utils.escapeHtml(p.name)}', ${p.stock_qty})" title="Adjust Stock">
                    <i class="bi bi-boxes text-accent"></i>
                  </button>
                  <button class="icon-btn" onclick="openEditProductModal(${p.id})" title="Edit Product">
                    <i class="bi bi-pencil"></i>
                  </button>
                </div>
              </td>
            </tr>
          `;
        }).join('');

        document.getElementById('pagination').innerHTML = ui.renderPagination({
          page: meta.page,
          totalPages: meta.totalPages,
          total: meta.total,
          limit: meta.limit,
          onPageChange: 'loadProducts'
        });
      } catch (err) {
        if (err.name !== 'AbortError') {
          tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-danger">${utils.escapeHtml(err.message)}</td></tr>`;
        }
      }
    }

    function clearProductForm() {
      document.getElementById('p_id').value = '';
      document.getElementById('productForm').reset();
      document.getElementById('p_sku').removeAttribute('readonly');
      document.getElementById('productModalTitle').innerHTML = '<i class="bi bi-box-seam text-accent"></i> Add New Product';
      document.getElementById('productErr').classList.add('d-none');
    }

    async function openEditProductModal(id) {
      try {
        const p = await api.get(`/api/products/${id}`);
        document.getElementById('p_id').value = p.id;
        document.getElementById('p_sku').value = p.sku;
        document.getElementById('p_sku').setAttribute('readonly', 'true');
        document.getElementById('p_name').value = p.name;
        document.getElementById('p_dept').value = p.department;
        document.getElementById('p_cat').value = p.category;
        document.getElementById('p_price').value = p.price;
        document.getElementById('p_cost').value = p.cost_price || '';
        document.getElementById('p_stock').value = p.stock_qty;
        document.getElementById('p_stock').setAttribute('readonly', 'true');
        document.getElementById('p_reorder').value = p.reorder_level;
        document.getElementById('p_img').value = p.image_url || '';
        document.getElementById('p_desc').value = p.description || '';
        document.getElementById('productModalTitle').innerHTML = '<i class="bi bi-pencil text-accent"></i> Edit Product';
        document.getElementById('productErr').classList.add('d-none');
        ui.openModal('productModal');
      } catch (err) {
        ui.toast(err.message, 'error');
      }
    }

    function openStockModal(id, name, currentStock) {
      document.getElementById('stk_prodId').value = id;
      document.getElementById('stk_prodName').textContent = `${name} (Current: ${currentStock} units)`;
      document.getElementById('stk_qty').value = '';
      document.getElementById('stk_notes').value = '';
      document.getElementById('stockErr').classList.add('d-none');
      ui.openModal('stockModal');
    }

    // Save product
    document.getElementById('productSaveBtn').addEventListener('click', async () => {
      const id = document.getElementById('p_id').value;
      const form = document.getElementById('productForm');
      const errBox = document.getElementById('productErr');
      const btn = document.getElementById('productSaveBtn');
      const sp = document.getElementById('productSpinner');

      errBox.classList.add('d-none');

      const isValid = validators.validateForm(form, {
        sku: { required: true, minLength: 3, label: 'SKU Code' },
        name: { required: true, minLength: 2, label: 'Product name' },
        price: { required: true, label: 'Price' }
      });
      if (!isValid) return;

      btn.disabled = true;
      sp.classList.remove('d-none');

      try {
        const payload = {
          sku: form.sku.value.trim().toUpperCase(),
          name: form.name.value.trim(),
          department: form.department.value,
          category: form.category.value.trim(),
          price: parseFloat(form.price.value),
          cost_price: form.cost_price.value ? parseFloat(form.cost_price.value) : 0,
          stock_qty: form.stock_qty.value ? parseInt(form.stock_qty.value, 10) : 0,
          reorder_level: form.reorder_level.value ? parseInt(form.reorder_level.value, 10) : 5,
          image_url: form.image_url.value.trim() || undefined,
          description: form.description.value.trim() || undefined
        };

        if (id) {
          await api.put(`/api/products/${id}`, payload);
          ui.toast('Product updated successfully!', 'success');
        } else {
          await api.post('/api/products', payload);
          ui.toast('Product added to catalog successfully!', 'success');
        }

        ui.closeModal('productModal');
        loadProducts(1);
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove('d-none');
        if (err.fields) {
          validators.showServerErrors(form, err.fields);
        }
      } finally {
        btn.disabled = false;
        sp.classList.add('d-none');
      }
    });

    // Save stock adjustment
    document.getElementById('stockSaveBtn').addEventListener('click', async () => {
      const id = document.getElementById('stk_prodId').value;
      const qty = document.getElementById('stk_qty').value;
      const type = document.getElementById('stk_type').value;
      const notes = document.getElementById('stk_notes').value;
      const errBox = document.getElementById('stockErr');
      const btn = document.getElementById('stockSaveBtn');
      const sp = document.getElementById('stockSpinner');

      if (!qty || parseInt(qty, 10) === 0) {
        errBox.textContent = 'Please enter a valid non-zero adjustment quantity.';
        errBox.classList.remove('d-none');
        return;
      }

      errBox.classList.add('d-none');
      btn.disabled = true;
      sp.classList.remove('d-none');

      try {
        await api.post(`/api/products/${id}/adjust-stock`, {
          quantity: parseInt(qty, 10),
          movement_type: type,
          notes: notes.trim() || undefined
        });
        ui.closeModal('stockModal');
        ui.toast('Stock adjusted and movement ledger logged successfully!', 'success');
        loadProducts(1);
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        sp.classList.add('d-none');
      }
    });

    const searchInput = document.getElementById('searchInput');
    const searchClearBtn = document.getElementById('searchClearBtn');

    searchInput.addEventListener('input', utils.debounce((e) => {
      searchClearBtn.classList.toggle('d-none', !e.target.value);
      loadProducts(1);
    }, 300));

    searchClearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchClearBtn.classList.add('d-none');
      loadProducts(1);
    });

    document.getElementById('deptFilter').addEventListener('change', () => loadProducts(1));
    document.getElementById('stockFilter').addEventListener('change', () => loadProducts(1));

    document.addEventListener('DOMContentLoaded', () => loadProducts(1));
  </script>
</body>
</html>
